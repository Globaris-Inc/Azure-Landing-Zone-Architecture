# .github/workflows/apply-on-merge.yml
# Purpose: Run terraform apply in dependency order on every push to main.
# Section: 10a — Pipeline & Tooling (bootstrap subset)
# Last updated: 2026-05-05
#
# Authentication: OIDC federated credential — no secrets stored in GitHub.
# Environment gate: the "production" GitHub Environment requires a required
#   reviewer approval before each job runs. Configure in:
#   Settings → Environments → production → Required reviewers.
#
# Apply order (enforced via `needs`):
#   0. platform/management-groups — MG tree + subscription placement (must come first)
#   1. platform/management   — LA workspace, Automation Account (no VNet dep)
#   2. platform/connectivity — Hub VNets (depends on management for log destination)
#   3. platform/identity     — DC VMs or AADDS (depends on connectivity for VNet)
#   4. platform/security     — Sentinel (depends on management LA workspace)
#   5. landing-zones         — parallel, all depend on connectivity hub
#
# Adding modules: add a new job following the pattern below, referencing the
# appropriate `needs:` dependency to maintain the apply order.

name: Terraform Apply (Merge to Main)

on:
  push:
    branches:
      - main
    paths:
      - "platform/**"
      - "landing-zones/**"
      - "modules/**"
      - "envs/**"

permissions:
  id-token: write
  contents: read

# Common env block — all jobs inherit these.
# ARM_* vars authenticate the azurerm provider via OIDC.
# TF_VAR_* vars supply subscription IDs and tenant ID from GitHub Actions secrets.
# Modules that don't declare a given variable silently ignore its TF_VAR_.
env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_FILE: "../../envs/poc.tfvars"
  TF_VAR_tenant_id:                    ${{ secrets.AZURE_TENANT_ID }}
  TF_VAR_management_subscription_id:   ${{ secrets.MANAGEMENT_SUBSCRIPTION_ID }}
  TF_VAR_connectivity_subscription_id: ${{ secrets.CONNECTIVITY_SUBSCRIPTION_ID }}
  TF_VAR_identity_subscription_id:     ${{ secrets.IDENTITY_SUBSCRIPTION_ID }}
  TF_VAR_security_subscription_id:     ${{ secrets.SECURITY_SUBSCRIPTION_ID }}
  TF_VAR_landingzones_subscription_id: ${{ secrets.LANDINGZONES_SUBSCRIPTION_ID }}
  # Section 8 — Security
  TF_VAR_terraform_sp_object_id:       ${{ secrets.TERRAFORM_SP_OBJECT_ID }}
  TF_VAR_security_contact_email:       ${{ secrets.SECURITY_CONTACT_EMAIL }}
  TF_VAR_budget_alert_contact_emails:  '["${{ secrets.BUDGET_ALERT_EMAIL }}"]'
  # Section 9 — Landing Zone cross-module values (populate after first connectivity apply)
  TF_VAR_primary_hub_vnet_id:          ${{ secrets.PRIMARY_HUB_VNET_ID }}
  TF_VAR_primary_hub_vnet_name:        ${{ secrets.PRIMARY_HUB_VNET_NAME }}
  TF_VAR_primary_hub_rg_name:          ${{ secrets.PRIMARY_HUB_RG_NAME }}
  TF_VAR_primary_firewall_private_ip:  ${{ secrets.PRIMARY_FIREWALL_PRIVATE_IP }}
  TF_VAR_secondary_hub_vnet_id:        ${{ secrets.SECONDARY_HUB_VNET_ID }}
  TF_VAR_secondary_hub_vnet_name:      ${{ secrets.SECONDARY_HUB_VNET_NAME }}
  TF_VAR_secondary_hub_rg_name:        ${{ secrets.SECONDARY_HUB_RG_NAME }}
  TF_VAR_secondary_firewall_private_ip: ${{ secrets.SECONDARY_FIREWALL_PRIVATE_IP }}
  TF_VAR_platform_law_workspace_id:    ${{ secrets.PLATFORM_LAW_WORKSPACE_ID }}
  TF_VAR_platform_action_group_id:     ${{ secrets.PLATFORM_ACTION_GROUP_ID }}
  TF_VAR_sql_aad_admin_object_id:      ${{ secrets.SQL_AAD_ADMIN_OBJECT_ID }}
  TF_VAR_sql_aad_admin_login:          ${{ secrets.SQL_AAD_ADMIN_LOGIN }}
  # Section 4 — Private DNS + NSG flow logs
  TF_VAR_platform_law_customer_id:     ${{ secrets.PLATFORM_LAW_CUSTOMER_ID }}
  # Section 5 — Zero Trust + Conditional Access
  TF_VAR_break_glass_group_object_id:      ${{ secrets.BREAK_GLASS_GROUP_OBJECT_ID }}
  TF_VAR_pim_privileged_group_object_id:   ${{ secrets.PIM_PRIVILEGED_GROUP_OBJECT_ID }}
  TF_VAR_pim_approver_group_object_id:     ${{ secrets.PIM_APPROVER_GROUP_OBJECT_ID }}
  # Section 6 — Defender for Cloud + Sentinel
  TF_VAR_sentinel_owner_group_object_id:   ${{ secrets.SENTINEL_OWNER_GROUP_OBJECT_ID }}

jobs:
  # --------------------------------------------------------------------------
  # 0. Management Groups — first; all other jobs depend on MGs existing
  # --------------------------------------------------------------------------
  apply-management-groups:
    name: Apply — platform/management-groups
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        working-directory: platform/management-groups
        run: |
          terraform init \
            -backend-config="../../envs/poc.backend.hcl" \
            -backend-config="key=platform/management-groups/terraform.tfstate" \
            -input=false

      - name: Terraform Apply
        working-directory: platform/management-groups
        run: |
          terraform apply \
            -var-file="../../envs/poc.tfvars" \
            -auto-approve \
            -input=false

  # --------------------------------------------------------------------------
  # 1. Management — depends on MGs existing (policy assignments scope to MG)
  # --------------------------------------------------------------------------
  apply-management:
    name: Apply — platform/management
    runs-on: ubuntu-latest
    environment: production
    needs: [apply-management-groups]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        working-directory: platform/management
        run: |
          terraform init \
            -backend-config="../../envs/poc.backend.hcl" \
            -backend-config="key=platform/management/terraform.tfstate" \
            -input=false

      - name: Terraform Apply
        working-directory: platform/management
        run: |
          terraform apply \
            -var-file="../../envs/poc.tfvars" \
            -auto-approve \
            -input=false

  # --------------------------------------------------------------------------
  # 2. Connectivity — depends on Management (log destination must exist)
  # --------------------------------------------------------------------------
  apply-connectivity:
    name: Apply — platform/connectivity
    runs-on: ubuntu-latest
    environment: production
    needs: [apply-management]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        working-directory: platform/connectivity
        run: |
          terraform init \
            -backend-config="../../envs/poc.backend.hcl" \
            -backend-config="key=platform/connectivity/terraform.tfstate" \
            -input=false

      - name: Terraform Apply
        working-directory: platform/connectivity
        run: |
          terraform apply \
            -var-file="../../envs/poc.tfvars" \
            -auto-approve \
            -input=false

  # --------------------------------------------------------------------------
  # 3. Identity — Zero Trust + CA policies (depends on MGs for policy scope)
  #    Uses azuread provider; no VNet dependency.
  # --------------------------------------------------------------------------
  apply-identity:
    name: Apply — platform/identity
    runs-on: ubuntu-latest
    environment: production
    needs: [apply-management-groups]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        working-directory: platform/identity
        run: |
          terraform init \
            -backend-config="../../envs/poc.backend.hcl" \
            -backend-config="key=platform/identity/terraform.tfstate" \
            -input=false

      - name: Terraform Apply
        working-directory: platform/identity
        run: |
          terraform apply \
            -var-file="../../envs/poc.tfvars" \
            -auto-approve \
            -input=false

  # --------------------------------------------------------------------------
  # 4. Security (Sentinel) — Section 6 extends with regulatory compliance
  #    policy assignments at root MG scope. apply-management transitively
  #    requires apply-management-groups, so root MG existence is satisfied.
  # --------------------------------------------------------------------------
  apply-security:
    name: Apply — platform/security
    runs-on: ubuntu-latest
    environment: production
    needs: [apply-management]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        working-directory: platform/security
        run: |
          terraform init \
            -backend-config="../../envs/poc.backend.hcl" \
            -backend-config="key=platform/security/terraform.tfstate" \
            -input=false

      - name: Terraform Apply
        working-directory: platform/security
        run: |
          terraform apply \
            -var-file="../../envs/poc.tfvars" \
            -auto-approve \
            -input=false

  # --------------------------------------------------------------------------
  # 5. Landing Zones — parallel, all depend on connectivity hub
  # --------------------------------------------------------------------------
  apply-corp-a1:
    name: Apply — landing-zones/corp-a1
    runs-on: ubuntu-latest
    environment: production
    needs: [apply-connectivity, apply-security]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        working-directory: landing-zones/corp-a1
        run: |
          terraform init \
            -backend-config="../../envs/poc.backend.hcl" \
            -backend-config="key=landing-zones/corp-a1/terraform.tfstate" \
            -input=false

      - name: Terraform Apply
        working-directory: landing-zones/corp-a1
        run: |
          terraform apply \
            -var-file="../../envs/poc.tfvars" \
            -auto-approve \
            -input=false

  apply-corp-a2:
    name: Apply — landing-zones/corp-a2
    runs-on: ubuntu-latest
    environment: production
    needs: [apply-connectivity, apply-security]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        working-directory: landing-zones/corp-a2
        run: |
          terraform init \
            -backend-config="../../envs/poc.backend.hcl" \
            -backend-config="key=landing-zones/corp-a2/terraform.tfstate" \
            -input=false

      - name: Terraform Apply
        working-directory: landing-zones/corp-a2
        run: |
          terraform apply \
            -var-file="../../envs/poc.tfvars" \
            -auto-approve \
            -input=false

  apply-online-p1:
    name: Apply — landing-zones/online-p1
    runs-on: ubuntu-latest
    environment: production
    needs: [apply-connectivity, apply-security]

    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform Init
        working-directory: landing-zones/online-p1
        run: |
          terraform init \
            -backend-config="../../envs/poc.backend.hcl" \
            -backend-config="key=landing-zones/online-p1/terraform.tfstate" \
            -input=false

      - name: Terraform Apply
        working-directory: landing-zones/online-p1
        run: |
          terraform apply \
            -var-file="../../envs/poc.tfvars" \
            -auto-approve \
            -input=false
