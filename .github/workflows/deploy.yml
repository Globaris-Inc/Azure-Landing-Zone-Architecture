# .github/workflows/deploy.yml
# Purpose: Manual Terraform plan/apply for ONE root or the WHOLE environment (in order).
# Section: 10 — Pipeline & Tooling (ADR-019). Replaces apply-on-merge.yml (LESSON 17:
#          deploys are explicit, not merge-triggered).
# Last updated: 2026-07-16
#
# Requirement 1 (per-root): set target=<a single root>.
# Requirement 2 (full env): set target=all — the needs: graph applies every root in
#          dependency order (mgmt-groups -> mgmt -> {connectivity,security}+identity ->
#          spokes (parallel) -> synthetic).
#
# Gating: action=apply runs jobs in the `production` GitHub Environment (required
#          reviewer). action=plan is ungated (dry-run). OIDC only — no secrets for login.
#
# Single-target mechanics: upstream `needs:` jobs are skipped when target!=all; the
# `!failure() && !cancelled()` status check lets the selected job run anyway. For
# action=apply on a single root, the root's upstream state must already exist.
#
# action=force-unlock: pure state-lock release (no Azure mutation, no state content
# change), for a stuck azurerm backend lease (e.g. a local session's IP rotated out of
# the state-SA firewall allowlist before it could release cleanly). Same shape as
# untaint: single target only, ungated (reuses the plan-path OIDC credential), and it
# still runs manage_runner_ip so the runner can reach the firewalled state SA.
name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Root to act on, or 'all' for the whole environment in order"
        type: choice
        default: all
        options:
          - all
          - platform/management-groups
          - platform/management
          - platform/connectivity
          - platform/identity
          - platform/security
          - landing-zones/corp-a1
          - landing-zones/corp-a2
          - landing-zones/online-p1
          - landing-zones/bank-app-p1
          - landing-zones/bank-data-p1
          - synthetic
      action:
        description: "plan (dry-run, ungated) | apply (gated by production) | untaint (state op, single target + resource_address) | force-unlock (state op, single target + lock_id)"
        type: choice
        default: plan
        options:
          - plan
          - apply
          - untaint
          - force-unlock
      resource_address:
        # ADR-029 recovery. Only read by action=untaint. Terraform resource address to
        # clear the taint marker on (e.g. azurerm_active_directory_domain_service.this[0]).
        # Untaint is a pure state write (no Azure mutation); it stays ungated like plan.
        # Single target only (target != all) so the address resolves in exactly one root's
        # state. Leave blank for plan/apply.
        description: "action=untaint only: Terraform resource address to untaint (single target). Blank otherwise."
        type: string
        default: ""
        required: false
      lock_id:
        # Recovery for a stuck azurerm backend state lease (orphaned lock, e.g. the
        # holder's IP rotated out of the state-SA firewall allowlist before it could
        # release cleanly). Only read by action=force-unlock. Pure lock release, no state
        # content change and no Azure infrastructure mutation. Single target only (target
        # != all) so the lock ID resolves against exactly one root's state. Get the lock
        # ID from the failed run's "Error acquiring the state lock" message (field "ID").
        # Leave blank for plan/apply/untaint.
        description: "action=force-unlock only: the stuck lock's ID (GUID, single target). Blank otherwise."
        type: string
        default: ""
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  # Fail-fast guard (ADR-029). action=untaint is a PER-ROOT state write: resource_address
  # is free-text and resolves against ONE root's state. With target=all it would fan the
  # SAME address into every root - e.g. azurerm_mssql_server.this has no count/for_each so
  # its address is byte-identical in corp-a1 AND corp-a2 state, and untaint (a silent state
  # write, no confirmation) would clear the taint in BOTH. Reject it before any root job
  # runs. Mirrors the existing single-target rule (manage_runner_ip: target != 'all'). The
  # root jobs below ALSO disable their target=='all' branch for untaint, so this guard is
  # the loud error and that `if` is the enforcement (defense in depth).
  guard-untaint-target:
    if: ${{ inputs.action == 'untaint' && inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject untaint with target=all
        run: |
          echo "::error::action=untaint requires a single target (target != 'all'). resource_address resolves per-root state and target=all would fan it into every root. Re-run with a specific target."
          exit 1

  # Same single-target rule as guard-untaint-target above: force-unlock's lock_id is a
  # per-root state lease ID. target=all would try the same lock_id against every root's
  # state, which is meaningless (a lock ID only ever matches the ONE root whose lease it
  # is) and would fail loudly per-root anyway - reject it up front instead.
  guard-force-unlock-target:
    if: ${{ inputs.action == 'force-unlock' && inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject force-unlock with target=all
        run: |
          echo "::error::action=force-unlock requires a single target (target != 'all'). lock_id resolves against exactly one root's state lease. Re-run with a specific target."
          exit 1

  management-groups:
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'platform/management-groups') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/management-groups
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  management:
    needs: [management-groups]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'platform/management') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/management
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  connectivity:
    needs: [management]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'platform/connectivity') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/connectivity
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  identity:
    needs: [management-groups]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'platform/identity') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/identity
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  security:
    needs: [management]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'platform/security') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/security
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  corp-a1:
    needs: [connectivity, security]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'landing-zones/corp-a1') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/corp-a1
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  corp-a2:
    needs: [connectivity, security]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'landing-zones/corp-a2') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/corp-a2
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  online-p1:
    needs: [connectivity, security]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'landing-zones/online-p1') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/online-p1
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  bank-app-p1:
    needs: [connectivity, security]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'landing-zones/bank-app-p1') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/bank-app-p1
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  bank-data-p1:
    needs: [connectivity, security]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'landing-zones/bank-data-p1') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/bank-data-p1
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit

  synthetic:
    # Ordering hygiene only: synthetic does not consume bank-app-p1/bank-data-p1 outputs,
    # but for target=all it should still run after every landing-zone spoke, not just corp/online.
    needs: [corp-a1, corp-a2, online-p1, bank-app-p1, bank-data-p1]
    if: ${{ !failure() && !cancelled() && ((inputs.target == 'all' && inputs.action != 'untaint' && inputs.action != 'force-unlock') || inputs.target == 'synthetic') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: synthetic
      action: ${{ inputs.action }}
      resource_address: ${{ inputs.resource_address }}
      lock_id: ${{ inputs.lock_id }}
      backend_rel: "../"
      gh_environment: ${{ inputs.action == 'apply' && 'production' || '' }}
      # LESSON 16: JIT-allowlist the runner IP on the firewalled state SA. Single-target
      # only (races on target=all, where sibling roots mutate the same SA firewall).
      manage_runner_ip: ${{ inputs.target != 'all' }}
    secrets: inherit
