# .github/workflows/_probe-sp-mg.yml
#
# *** TEMPORARY / DIAGNOSTIC / DELETE AFTER USE ***
#
# This is a throwaway probe, NOT part of the deploy/teardown pipeline. It exists to get
# EMPIRICAL PROOF of how the teardown OIDC service principal (object id e630bdd0, scoped RBAC
# per ADR-021/OQ-008 - see bootstrap/identity.tf) actually behaves against management-group
# reads, before the real MG-existence-gate fix (ADR-054 point 11 follow-up) is built. Attempt 4
# (run 29753193590) showed the SP gets `AuthorizationFailed` (HTTP 403, NOT NotFound) when it
# probes a DELETED MG scope with `az account management-group show`, because its MG-read grants
# come from role assignments scoped to the globaris subtree (identity.tf:163-187) which are
# deleted along with the subtree - unlike a tenant-root-privileged human, who gets a clean
# NotFound on the same call. The candidate fix is to replace the per-scope `show` probe with a
# single `az account management-group list` (the SP also holds Management Group Contributor at
# the tenant root, identity.tf:152, which is never deleted, and that role grants MG LIST) and
# check name membership instead - a deleted MG is simply absent from the list, no per-scope 403.
# This workflow does NOT implement that fix. It only observes.
#
# READ-ONLY CONTRACT: every step below is a `list` or `show` call. NOTHING here creates,
# deletes, or mutates any resource. Every az call is guarded with `|| true` so a nonzero exit
# (the expected 403 in step 3) never fails the job - this is a probe, not a gate, and the job
# is expected to exit 0 regardless of what the individual az calls report.
#
# Delete this file once the candidate fix above has been validated against its findings - it
# has no reason to exist in the pipeline afterward.
#
# TRIGGER NOTE: this runs on `push` (scoped to this feature branch + this file's own path)
# rather than `workflow_dispatch`, because workflow_dispatch only registers on the repo's
# default branch and this throwaway has no business being pushed to protected main. Deleting
# this file is itself a push that touches the path filter below, so removal triggers one final
# harmless run (or none, if the delete lands outside the matched branch) - either way, safe.
name: "[PROBE] SP management-group read behavior (temporary, delete after use)"

on:
  push:
    branches: [feature/teardown-redesign]
    paths: ['.github/workflows/_probe-sp-mg.yml']

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    name: "Probe SP MG-read behavior"
    runs-on: ubuntu-latest
    # Same GitHub Environment as the real teardown jobs - this is what binds the SAME
    # federated credential (-> the same SP object id e630bdd0 that is failing) rather than a
    # different identity. Deliberately NOT the production environment.
    environment: production-destroy
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: "Probe 1 - management-group list (table)"
        run: |
          echo "=================================================================="
          echo "PROBE 1: az account management-group list -o table"
          echo "Question: does LIST succeed for the SP, and what remains now that"
          echo "only the tenant root should be left?"
          echo "=================================================================="
          az account management-group list -o table || echo "::warning::Probe 1 call returned non-zero (see output above) - this is diagnostic, not a failure."
          echo "-- end probe 1 --"

      - name: "Probe 2 - management-group list (name set)"
        run: |
          echo "=================================================================="
          echo "PROBE 2: az account management-group list --query \"[].name\" -o tsv"
          echo "Question: this is the clean name set the candidate list-oracle fix"
          echo "would check membership against."
          echo "=================================================================="
          az account management-group list --query "[].name" -o tsv || echo "::warning::Probe 2 call returned non-zero (see output above) - this is diagnostic, not a failure."
          echo "-- end probe 2 --"

      - name: "Probe 3 - show on a DELETED MG (expect 403)"
        run: |
          echo "=================================================================="
          echo "PROBE 3: az account management-group show --name globaris"
          echo "Question: capture the EXACT error the SP gets probing a deleted MG."
          echo "Expected: HTTP 403 AuthorizationFailed (NOT a 404 NotFound) - this is"
          echo "the root cause under test. A nonzero exit here is EXPECTED and must"
          echo "not fail this job."
          echo "=================================================================="
          az account management-group show --name globaris 2>&1 || true
          echo "-- end probe 3 --"

      - name: "Probe 4 - show on the tenant root (expect success)"
        run: |
          echo "=================================================================="
          echo "PROBE 4: az account management-group show --name <tenant-root-id>"
          echo "Question: confirm 'show' works for the SP against an MG that"
          echo "definitely still exists (the tenant root is never deleted)."
          echo "The tenant root MG's name is the tenant ID itself."
          echo "=================================================================="
          if [ -n "${AZURE_TENANT_ID:-}" ]; then
            az account management-group show --name "$AZURE_TENANT_ID" 2>&1 || true
          else
            echo "AZURE_TENANT_ID not available in this step's environment - skipping probe 4."
          fi
          echo "-- end probe 4 --"
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

      - name: "Probe summary"
        if: always()
        run: |
          echo "=================================================================="
          echo "All 4 probes ran (or were skipped) above. This job exits 0"
          echo "unconditionally - it is a read-only diagnostic, not a gate."
          echo "Review the captured output to confirm the list-oracle candidate"
          echo "fix (ADR-054 point 11 follow-up) before it is implemented."
          echo "=================================================================="
          exit 0
