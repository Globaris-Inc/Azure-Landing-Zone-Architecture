# .github/workflows/_tf-root.yml
# Purpose: Reusable Terraform workflow for a SINGLE root — plan | apply | destroy.
# Section: 10 — Pipeline & Tooling (ADR-019). Called by deploy.yml and teardown.yml.
# Last updated: 2026-07-06
#
# Auth: OIDC federated credential — no secrets stored for login. Gated callers
# pass a GitHub Environment via `gh_environment`; an EMPTY string = ungated
# (used for plan). The matching federated credential must exist in bootstrap
# (identity.tf: environment:production / environment:production-destroy) — see
# the re-apply note there.
#
# Firewalled state SA (ADR-025): the Terraform state account is default_action=Deny
# with a STATIC ip_rules list (bootstrap/main.tf). Hosted-runner egress IPs are not
# stable AND are drawn from a dynamic SNAT pool, so pinning ONE runner IP is racy
# (readiness probe and Terraform's own read can leave via different front-end IPs).
# DECISION (devsecops, ADR-025): for ad-hoc single-root runs from a hosted runner set
# the caller input `manage_runner_ip: true` to flip the SA `default_action` to Allow for
# the job window and restore it to Deny on exit. Allow-all is monotonic once propagated,
# so the race disappears; data stays protected by Entra-only auth (shared keys disabled)
# + Storage Blob Data RBAC + TLS 1.2 + CMK. The static ip_rules stay untouched. The
# supported default (manage_runner_ip: false) is to keep the runner CIDR/IP in bootstrap
# `ip_allow_list` as a documented PREREQUISITE (docs/cicd-deploy-teardown.md §8). See that
# input's docs — single-root only; the default_action flip races on target=all.
name: _terraform-root

on:
  workflow_call:
    inputs:
      root:
        description: "Root module path (e.g. platform/connectivity, synthetic)"
        required: true
        type: string
      action:
        description: "plan | apply | destroy | untaint | force-unlock"
        required: true
        type: string
      resource_address:
        # ADR-029 recovery. Only read by action=untaint: the Terraform resource address
        # whose taint marker to clear (e.g. azurerm_active_directory_domain_service.this[0]).
        # Ignored by plan/apply/destroy. Passed via env into the untaint step (never
        # interpolated straight into a shell) to avoid run-step injection.
        description: "action=untaint only: resource address to untaint. Empty otherwise."
        required: false
        type: string
        default: ""
      lock_id:
        # Stuck-lock recovery. Only read by action=force-unlock: the ID of the orphaned
        # azurerm backend state lease to release (a pure lock release, no state content
        # change and no Azure infrastructure mutation). Ignored by plan/apply/destroy/untaint.
        # Passed via env into the force-unlock step (never interpolated straight into a
        # shell) to avoid run-step injection.
        description: "action=force-unlock only: the stuck lock ID to release. Empty otherwise."
        required: false
        type: string
        default: ""
      backend_rel:
        description: "Relative prefix to envs/ — '../../' for most roots, '../' for synthetic"
        required: true
        type: string
      gh_environment:
        description: "GitHub Environment to gate on (empty string = ungated, e.g. plan)"
        required: false
        type: string
        default: ""
      manage_runner_ip:
        # ADR-025 (firewalled state SA). The state account is default_action=Deny with a
        # static ip_rules list (bootstrap/main.tf). Hosted-runner egress IPs are NOT stable
        # and SNAT across a dynamic pool, so pinning one IP is racy and `init` can 403 on
        # the blob data plane. When true, this job flips the SA `default_action` to Allow
        # for the whole run and restores it to Deny on exit (if: always()). Only
        # default_action changes; the static ip_rules and AzureServices bypass are
        # preserved. Default false = the runner IP is assumed to be covered by bootstrap
        # `ip_allow_list` (the documented prerequisite — see the workflow header and
        # docs/cicd-deploy-teardown.md §8).
        #
        # WARNING (concurrency): on `target=all`, sibling roots run in parallel and would
        # flip the SAME state SA `default_action` against each other — one job's restore-Deny
        # can cut another mid-init. Only enable this for SINGLE-root (`target != all`) runs.
        # deploy.yml already gates manage_runner_ip on target != 'all'.
        description: "Flip the state SA default_action to Allow for this run, restored to Deny on exit (single-root runs only)"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.root }}
    runs-on: ubuntu-latest
    # Empty gh_environment => no environment gate (plan). 'production' / 'production-destroy' => gated.
    environment: ${{ inputs.gh_environment }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Per-resource values (subscription IDs, object IDs, cross-module outputs) — secrets, not login IDs.
      TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      TF_VAR_management_subscription_id: ${{ secrets.MANAGEMENT_SUBSCRIPTION_ID }}
      TF_VAR_connectivity_subscription_id: ${{ secrets.CONNECTIVITY_SUBSCRIPTION_ID }}
      TF_VAR_identity_subscription_id: ${{ secrets.IDENTITY_SUBSCRIPTION_ID }}
      TF_VAR_security_subscription_id: ${{ secrets.SECURITY_SUBSCRIPTION_ID }}
      TF_VAR_landingzones_subscription_id: ${{ secrets.LANDINGZONES_SUBSCRIPTION_ID }}
      TF_VAR_terraform_sp_object_id: ${{ secrets.TERRAFORM_SP_OBJECT_ID }}
      TF_VAR_security_contact_email: ${{ secrets.SECURITY_CONTACT_EMAIL }}
      TF_VAR_budget_alert_contact_emails: '["${{ secrets.BUDGET_ALERT_EMAIL }}"]'
      TF_VAR_primary_hub_vnet_id: ${{ secrets.PRIMARY_HUB_VNET_ID }}
      TF_VAR_primary_hub_vnet_name: ${{ secrets.PRIMARY_HUB_VNET_NAME }}
      TF_VAR_primary_hub_rg_name: ${{ secrets.PRIMARY_HUB_RG_NAME }}
      TF_VAR_primary_firewall_private_ip: ${{ secrets.PRIMARY_FIREWALL_PRIVATE_IP }}
      TF_VAR_secondary_hub_vnet_id: ${{ secrets.SECONDARY_HUB_VNET_ID }}
      TF_VAR_secondary_hub_vnet_name: ${{ secrets.SECONDARY_HUB_VNET_NAME }}
      TF_VAR_secondary_hub_rg_name: ${{ secrets.SECONDARY_HUB_RG_NAME }}
      TF_VAR_secondary_firewall_private_ip: ${{ secrets.SECONDARY_FIREWALL_PRIVATE_IP }}
      TF_VAR_platform_law_workspace_id: ${{ secrets.PLATFORM_LAW_WORKSPACE_ID }}
      TF_VAR_platform_action_group_id: ${{ secrets.PLATFORM_ACTION_GROUP_ID }}
      TF_VAR_sql_aad_admin_object_id: ${{ secrets.SQL_AAD_ADMIN_OBJECT_ID }}
      TF_VAR_sql_aad_admin_login: ${{ secrets.SQL_AAD_ADMIN_LOGIN }}
      TF_VAR_platform_law_customer_id: ${{ secrets.PLATFORM_LAW_CUSTOMER_ID }}
      TF_VAR_break_glass_group_object_id: ${{ secrets.BREAK_GLASS_GROUP_OBJECT_ID }}
      TF_VAR_pim_privileged_group_object_id: ${{ secrets.PIM_PRIVILEGED_GROUP_OBJECT_ID }}
      TF_VAR_pim_approver_group_object_id: ${{ secrets.PIM_APPROVER_GROUP_OBJECT_ID }}
      TF_VAR_sentinel_owner_group_object_id: ${{ secrets.SENTINEL_OWNER_GROUP_OBJECT_ID }}
      TF_VAR_honeypot_user_principal_name: ${{ secrets.HONEYPOT_USER_PRINCIPAL_NAME }}
      TF_VAR_cost_pattern_budget_alert_emails: '["${{ secrets.BUDGET_ALERT_EMAIL }}"]'
      TF_VAR_cost_guardrails_alert_emails: '["${{ secrets.BUDGET_ALERT_EMAIL }}"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repo Variables (LESSON 15 — vars, not secrets)
        run: |
          missing=""
          [ -n "${{ vars.AZURE_CLIENT_ID }}" ]       || missing="$missing AZURE_CLIENT_ID"
          [ -n "${{ vars.AZURE_TENANT_ID }}" ]       || missing="$missing AZURE_TENANT_ID"
          [ -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository Variables:$missing (Settings -> Variables, NOT Secrets)"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ADR-025 — open the firewalled state SA for this run by flipping default_action
      # to Allow (opt-in). Off by default; see the manage_runner_ip input docs. Captures
      # the SA name/RG/container from poc.backend.hcl so it needs no extra inputs.
      - name: Open state SA firewall for this run (ADR-025, opt-in)
        if: ${{ inputs.manage_runner_ip }}
        # Run from the root dir so backend_rel ('../../' | '../') resolves like Init does.
        working-directory: ${{ inputs.root }}
        env:
          BACKEND_HCL: ${{ inputs.backend_rel }}envs/poc.backend.hcl
        run: |
          set -euo pipefail
          SA_NAME="$(grep -E '^\s*storage_account_name' "$BACKEND_HCL" | sed -E 's/.*=\s*"?([^"#[:space:]]+)"?.*/\1/')"
          RG_NAME="$(grep -E '^\s*resource_group_name'  "$BACKEND_HCL" | sed -E 's/.*=\s*"?([^"#[:space:]]+)"?.*/\1/')"
          CONTAINER="$(grep -E '^\s*container_name'     "$BACKEND_HCL" | sed -E 's/.*=\s*"?([^"#[:space:]]+)"?.*/\1/')"
          echo "Flipping default_action=Allow on $SA_NAME (rg $RG_NAME) for this run"
          # ONLY default_action changes here. `az storage account update --default-action`
          # does not touch --ip-address rules or --bypass, so the static ip_rules and the
          # AzureServices bypass set in bootstrap are preserved. Restored to Deny on exit.
          az storage account update \
            --name "$SA_NAME" --resource-group "$RG_NAME" \
            --default-action Allow --output none
          echo "STATE_SA_NAME=$SA_NAME" >> "$GITHUB_ENV"
          echo "STATE_SA_RG=$RG_NAME"   >> "$GITHUB_ENV"
          echo "SA_OPENED=1"            >> "$GITHUB_ENV"
          # default_action=Allow is monotonic once propagated (unlike a single pinned IP,
          # which can be admitted for the probe yet rejected seconds later because the
          # runner SNATs across a dynamic pool and IP-rule propagation is per front-end
          # node). Propagation to the data plane is still NOT instant (Azure: up to a few
          # minutes) AND is eventually consistent ACROSS front-end nodes: on 2026-07-16
          # three B0a runs passed a single-success probe and still 403'd seconds later on
          # a stale-Deny front end (one survived only via the init retry backstop; one
          # died mid-plan where nothing retries). So a single successful probe is NOT
          # proof of propagation. Require 3 CONSECUTIVE successes, 8s apart, on the exact
          # access path init uses (a blob list on the state container via the logged-in
          # SP) before declaring the firewall open. The counter resets on any failure, so
          # we only proceed once the Allow has demonstrably settled across front ends.
          echo "Waiting for the state-SA firewall to open (3 consecutive probe successes required)..."
          ready=0
          consecutive=0
          for i in $(seq 1 32); do
            if az storage blob list \
                 --account-name "$SA_NAME" --container-name "$CONTAINER" \
                 --auth-mode login --num-results 1 --only-show-errors -o none 2>/dev/null; then
              consecutive=$((consecutive + 1))
              echo "Probe success $consecutive/3 (~$(( (i-1) * 8 ))s elapsed)."
              if [ "$consecutive" -ge 3 ]; then
                echo "State SA firewall settled after ~$(( (i-1) * 8 ))s."
                ready=1; break
              fi
            else
              if [ "$consecutive" -gt 0 ]; then
                echo "Probe FAILED after $consecutive success(es) - propagation not settled; counter reset."
              fi
              consecutive=0
            fi
            sleep 8
          done
          if [ "$ready" != "1" ]; then
            echo "::error::State SA firewall did not settle (3 consecutive probe successes) within ~256s."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ inputs.root }}
        # Bounded retry backstop for the state-SA firewall race (ADR-025 follow-up).
        # The "Open state SA firewall" step flips default_action=Allow and now requires
        # 3 CONSECUTIVE successful blob-list probes before proceeding (2026-07-16 fix).
        # Even so, an Allow flip is eventually consistent ACROSS front-end nodes, so
        # Terraform's own backend connection can still land on a node that has not yet
        # received the update and 403 on "listing blobs". Since default_action=Allow
        # only ever propagates TOWARD open (monotonic per node, and stays open for the
        # whole job window), retrying init over ~75-90s succeeds once propagation
        # completes. Harmless when manage_runner_ip is false - init just passes on
        # attempt 1. A genuinely broken init still fails loudly: after the final
        # attempt we exit non-zero.
        run: |
          set -euo pipefail
          attempts=6
          for i in $(seq 1 "$attempts"); do
            echo "terraform init attempt $i/$attempts"
            if terraform init \
                 -backend-config="${{ inputs.backend_rel }}envs/poc.backend.hcl" \
                 -backend-config="key=${{ inputs.root }}/terraform.tfstate" \
                 -input=false; then
              echo "terraform init succeeded on attempt $i/$attempts."
              exit 0
            fi
            if [ "$i" -lt "$attempts" ]; then
              echo "::warning::init attempt $i/$attempts failed (likely state-SA firewall still propagating); retrying in 15s"
              sleep 15
            fi
          done
          echo "::error::terraform init failed after $attempts attempts."
          exit 1

      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        working-directory: ${{ inputs.root }}
        run: terraform plan -var-file="${{ inputs.backend_rel }}envs/poc.tfvars" -input=false -no-color

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        working-directory: ${{ inputs.root }}
        run: terraform apply -var-file="${{ inputs.backend_rel }}envs/poc.tfvars" -input=false -auto-approve

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        working-directory: ${{ inputs.root }}
        run: terraform destroy -var-file="${{ inputs.backend_rel }}envs/poc.tfvars" -input=false -auto-approve

      # ADR-029 recovery. `terraform untaint` clears the taint marker on ONE resource so
      # the next apply KEEPS it (Read/refresh) instead of destroying-and-replacing it. This
      # recovers the built-but-tainted Entra DS managed domain: the timed-out create left it
      # in state TAINTED, which a plain apply would turn into a destructive `-/+` replace.
      # It is a PURE STATE WRITE (no Azure API mutation), scoped to a single resource address
      # and gated by the operator inspecting a follow-up plan before any apply. No
      # gh_environment gate (reuses the plan-path OIDC federated credential). Reaching the
      # firewalled state SA requires manage_runner_ip=true, so run this single-target
      # (deploy.yml sets manage_runner_ip = target != 'all'). Init has already run above.
      - name: Terraform Untaint (ADR-029 state recovery)
        if: ${{ inputs.action == 'untaint' }}
        working-directory: ${{ inputs.root }}
        env:
          RESOURCE_ADDRESS: ${{ inputs.resource_address }}
        run: |
          set -euo pipefail
          if [ -z "$RESOURCE_ADDRESS" ]; then
            echo "::error::action=untaint requires a non-empty resource_address (single resource, single target)."
            exit 1
          fi
          echo "Untainting '$RESOURCE_ADDRESS' in root '${{ inputs.root }}' (pure state write, no Azure mutation)."
          terraform untaint "$RESOURCE_ADDRESS"

      # Stuck-lock recovery. `terraform force-unlock` releases an orphaned azurerm backend
      # state lease so a following plan/apply can acquire it again. It is a PURE LOCK
      # RELEASE: no state content changes and no Azure infrastructure mutation. -force
      # skips the interactive confirmation prompt (this is a non-interactive runner). No
      # gh_environment gate (reuses the plan-path OIDC federated credential, same as
      # untaint). Reaching the firewalled state SA requires manage_runner_ip=true, so run
      # this single-target (deploy.yml sets manage_runner_ip = target != 'all', and its
      # guard-force-unlock-target job rejects target=all outright). Init has already run
      # above, which is what actually needs the lock to be free - a stuck lock can make
      # Init itself hang/fail, so this step only proceeds if Init succeeded despite the
      # lock (azurerm backend inits do not always take a lock; force-unlock is the
      # explicit release regardless).
      - name: Terraform Force-Unlock (stuck state lock recovery)
        if: ${{ inputs.action == 'force-unlock' }}
        working-directory: ${{ inputs.root }}
        env:
          LOCK_ID: ${{ inputs.lock_id }}
        run: |
          set -euo pipefail
          if [ -z "$LOCK_ID" ]; then
            echo "::error::action=force-unlock requires a non-empty lock_id (single lock, single target)."
            exit 1
          fi
          echo "Releasing lock '$LOCK_ID' in root '${{ inputs.root }}' (pure lock release, no state content change, no Azure mutation)."
          terraform force-unlock -force "$LOCK_ID"

      # Always restore default_action=Deny — even if a prior step failed — so the state SA
      # never stays publicly reachable past the run. Guarded on env.SA_OPENED being set by
      # the open step, so we only flip back what we flipped open.
      - name: Restore state SA firewall to Deny (ADR-025, opt-in)
        if: ${{ always() && inputs.manage_runner_ip && env.SA_OPENED == '1' }}
        run: |
          set -uo pipefail
          echo "Restoring default_action=Deny on $STATE_SA_NAME"
          az storage account update \
            --name "$STATE_SA_NAME" --resource-group "$STATE_SA_RG" \
            --default-action Deny --output none || \
            echo "::warning::Failed to restore Deny on $STATE_SA_NAME — set default_action=Deny manually."
