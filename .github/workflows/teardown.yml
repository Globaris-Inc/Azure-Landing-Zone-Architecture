# .github/workflows/teardown.yml
# Purpose: Manual, guarded, RELIABLE end-to-end teardown of the whole environment or one
#          root - zero manual deletion (ADR-054 / docs/teardown-redesign.md).
# Section: 10 - Pipeline & Tooling (ADR-019, ADR-054, OQ-012/OQ-013).
# Last updated: 2026-08-10
#
# Guards (destroy is irreversible):
#   1. `confirm` must be typed exactly as `destroy` (a cheap pre-check before any login).
#   2. `mode=az-sweep` requires `target=all` - az-sweep is a whole-estate fallback (Phase
#      0/2/3 are target=all only, Phase 1 is mode=terraform only), so az-sweep + a
#      single-root target would run NOTHING and still report green. Rejected before login.
#   3. Every destructive job runs in the `production-destroy` GitHub Environment (required
#      reviewer) - this is also the ONLY federated credential trust configured for these
#      operations (bootstrap/identity.tf), so it doubles as an OIDC auth requirement.
#
# Five-phase design (ADR-054, full fix-spec docs/teardown-redesign.md; Phase 4 added by
# ADR-068), fixing 4 root causes from an earlier E2E failure that forced manual deletion, plus
# the ADR-068 state-blob gap found in a later rebuild (a green target=all teardown left every
# workload/platform Terraform state blob fully populated, because mode=az-sweep never runs
# Phase 1 and Phase 1's own destroy is the only thing that ever emptied state natively):
#   Phase 0 - DISARM   (scripts/teardown-disarm.sh)   - az, always, first, target=all only.
#             Deletes every MG-scope policy ASSIGNMENT across the globaris tree BEFORE any
#             resource deletion, so DINE remediation cannot re-create resources mid-sweep
#             (fixes F3 - the rg-amba-monitoring-001 resurrection loop).
#   Phase 0.5 - DATABRICKS PRECASCADE (scripts/teardown-databricks-precascade.sh) - az,
#             target=all AND mode=terraform only (code-review Finding 2, 2026-07-30, ADR-066
#             decision 4 PREFERRED form). `enable_data_platform = true` is the LIVE setting
#             (envs/poc.tfvars), so bank-data-p1's Databricks workspace is genuinely deployed.
#             Force-deletes the workspace (--no-wait --force-deletion) WHILE IT IS STILL LIVE,
#             before Phase 1 runs, so the RP-managed resource group cascades cleanly instead of
#             being retained as an orphan by a later PLAIN terraform destroy (bank-data-p1's
#             pinned avm-res-databricks-workspace 0.5.0 module issues a plain delete with no
#             force-deletion). `needs: [guard, diagnostic-precascade]` (ORDERING ONLY, ADR-076
#             decision 1, 2026-08-10 - see below and this job's own comment for why); runs
#             alongside Phase 0 DISARM (no ordering relationship with disarm - genuinely disjoint
#             scopes). `bank-data-p1` (Phase 1, chain position 2) additionally `needs` this job.
#             Not wired for mode=az-sweep: Phase 1 never runs in that path, so az-sweep's own
#             step 1 (teardown-az-sweep.sh) already force-deletes the workspace first there -
#             wiring this job there too would be a redundant duplicate, not a fix.
#   Phase 0.5 - DIAGNOSTIC PRECASCADE (scripts/teardown-diagnostic-precascade.sh) - az,
#             target=all AND mode=terraform only (ADR-071 decision 4b, ADDED 2026-08-01).
#             Deletes every resource-scoped microsoft.insights/diagnosticSettings object WHILE
#             ITS HOST IS STILL LIVE. These are extension objects keyed to the host's URI: they
#             do not reliably cascade with the host, they are absent from state once state is
#             emptied, and once the host is gone they cannot be enumerated by ANY subscription,
#             RG or resource listing (ADR-068 FM-3), so they are invisible to every greenfield
#             proof and re-collide with `already exists` on the next apply that recreates a
#             same-named host. Eight such failures across bank-data-p1 and bank-app-p1 on
#             2026-07-31 are the live evidence. Fixes the SAME ordering regression ADR-066
#             decision 4 fixed for Databricks: Phase 2's step 1-pre (renamed from step 2-pre by
#             ADR-076 decision 1) sweeps this class but can only see LIVE hosts, and it runs after
#             all of Phase 1 has deleted them. Shares its whole body with step 1-pre via
#             `sweep_resource_diagnostic_settings` (teardown-common.sh) so the two cannot drift;
#             step 1-pre STAYS as the belt for the az-sweep path and anything this missed. Runs
#             alongside Phase 0 DISARM (genuinely disjoint scopes, no ordering relationship). The
#             Phase 1 CHAIN HEAD (`synthetic`) `needs` this job for ORDERING ONLY, so the sweep
#             completes before the first destroy deletes any host; it is NOT in that job's `if:`,
#             so a failure here never skips a layer (INV-1). Not wired for mode=az-sweep, same
#             reasoning as the Databricks job.
#
#             ORDERING BARRIER (ADR-076 decision 1, 2026-08-10, CORRECTING a prior claim in this
#             file). This job and the Databricks precascade above used to be wired as CONCURRENT
#             (both `needs: [guard]` only), on the stated premise that the two "act on disjoint
#             object classes" - that premise was FALSE for a Databricks-hosted diagnostic setting
#             (diag-dbw-* is an extension object keyed to the workspace URI the Databricks
#             precascade force-deletes), so whichever job reached the workspace first silently
#             won the race, and the diagnostic sweep losing it was invisible (no completeness
#             assertion existed before ADR-076 decision 2 either). Live evidence: teardown run
#             `31350223388`'s diagnostic-precascade died mid-enumeration on
#             rg-bank-data-p1-dbx-managed-globaris-poc (ResourceGroupNotFound) because the
#             concurrent Databricks precascade had already force-deleted it. The Databricks
#             precascade now `needs` THIS job (ordering only, `!cancelled()` form, never a gate -
#             ADR-071 "not a gate" and ADR-066 INV-1 both hold exactly as before). Standing rule
#             for future actors, added to the ADR-072 mirror table: any job or step that deletes
#             an estate host outside its owning root's in-order destroy MUST order after this
#             diagnostic-settings sweep.
#   Phase 1 - DESTROY  (terraform, per root, incl. synthetic) - mode=terraform only. `needs`
#             is for ORDERING ONLY; every root job's `if:` uses `!cancelled()` (NOT
#             `!failure()`), so one root's failure never cascade-skips the others (fixes F1).
#             `synthetic` IS a real root - synthetic/*.tf define real resources (RGs,
#             red-team ACA jobs, cost-pattern VM/storage) gated behind
#             `var.enable_synthetic_workload` (currently false) - it is hardened with the
#             same `!cancelled()` fix as every other root, not deleted from the graph; the F1
#             fix is the resilience fix, not root removal. `_tf-root.yml` also gained a
#             `terraform state list` pre-step that no-ops (exit 0) when state is empty/absent,
#             so an undeployed/already-emptied root (including a currently-inert synthetic)
#             can never even attempt a failing destroy.
#             ADR-065 (2026-07-29) restricted Phase 1 to single-root targets only, on the
#             theory that all-layers-green was unattainable at target=all. ADR-066
#             (2026-07-29, same day, SUPERSEDES ADR-065 decision 1 on fresh evidence -
#             KV purge protection and the Databricks deny-assignment do not actually block a
#             terraform destroy) restores it: at target=all, ALL 11 Phase 1 per-root
#             terraform destroy jobs then ran and went GREEN, SERIALIZED in a strictly LINEAR
#             reverse-dependency `needs` chain. **AMENDED 2026-08-01 (ADR-072 decision 6):**
#             `platform/management-groups` is no longer one of them - the chain is now 10 jobs
#             (synthetic -> bank-data-p1 -> bank-app-p1 -> online-p1 -> corp-a2 -> corp-a1 ->
#             security -> connectivity -> identity -> management), plus the non-counted Phase
#             1.5 attachment sweep between `identity` and `management` (see the AMENDED
#             2026-08-01 header note below) - so exactly ONE state-SA-touching job is open
#             at any instant (the JIT firewall flip races only on CONCURRENT flips, not
#             sequential ones - LESSON 31). Every Phase 1 root job now carries
#             `manage_runner_ip: true` UNCONDITIONALLY (ADR-066; previously
#             `${{ inputs.target != 'all' }}`, ADR-065) - it is only ever reached by a
#             serialized job now, whether single-root or the target=all chain, so the flip
#             is always safe. A single-root dispatch is UNAFFECTED by the chain: only that
#             one root's `if:` evaluates true, every other job in the chain skips, and
#             `needs` on a skipped predecessor never blocks the targeted job (the same
#             `!cancelled()` semantics F1 already established).
#   Phase 2 - AZ SWEEP (scripts/teardown-az-sweep.sh) - az, target=all only, both modes.
#             Fallback for mode=az-sweep (state gone, fixes F4) - there it remains the
#             PRIMARY, full-coverage whole-estate deleter, unchanged. In mode=terraform
#             (ADR-066: now the primary target=all path, Phase 1 runs) it is DEMOTED to a
#             thin remnant-catch BELT that runs AFTER all 10 Phase 1 jobs (ADR-072 decision 6
#             removed `platform/management-groups` from this count - see the AMENDED
#             2026-08-01 header note below), because
#             terraform-destroy now covers the bulk of the estate natively: (a) Databricks
#             workspace-delete cascade (never `az group delete` the RP-managed RG directly -
#             deny-assignment, fixes F2) - Databricks IS deployed in this estate
#             (enable_data_platform=true, envs/poc.tfvars); this step's own force-delete is
#             typically a no-op belt in the mode=terraform path because the Phase 0.5
#             `databricks-precascade` job (above) already cascaded the workspace + managed RG
#             before Phase 1 ran, per ADR-066 decision 4 - see that phase's own comment; (b)
#             orphaned-RG naming-pattern sweep (belt/backstop); (c) KV soft-delete/purge
#             report; (d) Security Log Analytics workspace purge (OQ-063) - now runs as this
#             script's LAST step (step 7b, after the reconcile wait, code-review Finding 1
#             fix, 2026-07-30) and is a BACKSTOP: `platform/security/providers.tf` purges the
#             LAW NATIVELY on terraform destroy (Cloud Engineer fix, same pass), so this step
#             is load-bearing only for the mode=az-sweep fallback (which never runs terraform
#             destroy) or an older `platform/security` state applied before that fix; (e) the
#             ADR-057 subscription-scope step 6, now a no-op backstop in the mode=terraform
#             path (platform/management and platform/security's own terraform destroy clean
#             subscription scope natively) but still the PRIMARY mechanism in the mode=az-sweep
#             fallback; (f, gated on `remove_mg_hierarchy`) bottom-up MG-hierarchy removal for a
#             clean redeploy slate (ADR-054 section 5 - subs are only re-parented to the tenant
#             root, never deleted).
#   Phase 3 - VERIFY   (scripts/teardown-verify.sh)   - az, always, last, target=all only.
#             FAILS LOUDLY (non-zero) if any estate remnant remains. A green Phase 3 IS the
#             definition of "teardown succeeded E2E" - never a silent half-teardown.
#   Phase 4 - STATE RESET (scripts/teardown-state-reset.sh) - az, target=all only, HARD-gated
#             on `needs.verify.result == 'success'` (not the file's usual `!cancelled()`
#             convention - see the state-reset job's own comment for why that is deliberate).
#             Overwrites every eligible workload/platform Terraform state blob with a
#             canonical, metadata-labelled EMPTY document (never deletes a blob - deletion is
#             permanently forbidden, INV-STATE, ADR-068) so a `target=all` teardown that goes
#             green also leaves the state backend behaving as if it had never been used,
#             identically in both modes. Two permanent/conditional carve-outs
#             (`platform/identity` under mode=az-sweep; `platform/management-groups` unless
#             `remove_mg_hierarchy=true`) are NOT reset - see that script's own header for the
#             full evidence-boundary reasoning. This closes the gap where a `mode=az-sweep`
#             teardown (Phase 1 never runs there) left every workload/platform root's state
#             fully populated describing resources VERIFY had just proven gone.
#
# AMENDED 2026-08-01 (DevSecOps fix round, teardown run 30685705802 - three defects referred
# from that run, ADR-072 ruling the ownership/topology questions in parallel):
#   - Phase 1.5 - ATTACHMENT SWEEP (scripts/teardown-attachment-sweep.sh, ADR-072 decision 4) -
#     az, target=all AND mode=terraform only, inserted between `identity` and `management` in
#     the chain. Clears cross-root RP-attached objects (Traffic Analytics' NWTA data-collection
#     endpoint/rule pair, the AKS addon's ContainerInsights solution) that land in
#     platform/management's resource group as a side effect of a DIFFERENT root's configuration,
#     so that root's own `terraform destroy` can go green without widening its
#     `prevent_deletion_if_contains_resources` blast radius. NOT a hard gate (same F1-style
#     wiring as `databricks-precascade` -> `bank-data-p1`) - a failure surfaces as
#     platform/management's own provider error or a Phase 2/3 remnant, never a skipped layer.
#   - Phase 1: `platform/management-groups` is AMENDED OUT of the mode=terraform PRIMARY
#     target=all path (ADR-072 decision 6, amending ADR-066 decision 1). Measured from that
#     run's own job log: its destroy spent 5h02m in Terraform's REFRESH prefix (which must
#     complete in full before any delete can be issued) and reached zero deletes before the
#     6-hour GitHub Actions job ceiling killed it - the SAME instant its re-minted OIDC
#     assertion also went stale (LESSON 46's "two ceilings that are the same number"). The
#     DISARM-causes-403-on-a-deleted-scope hypothesis was tested against the actual log and
#     REFUTED (every MG scope involved was still alive throughout that job's run; DISARM only
#     ever deletes POLICY assignments, a different object type from the roleAssignments that
#     stalled). This root's objects are overwhelmingly child objects of MG container scopes, and
#     Phase 2 step 4 (gated on `remove_mg_hierarchy`) already offers a cascading container
#     delete as the correct bulk primitive for exactly that shape - live evidence: two rebuild
#     cycles each applied exactly 537 objects cleanly after an MG-tree cascade, zero `already
#     exists` collisions. ADR-066 INV-1 ("all eleven Phase-1 layer destroys run and go green")
#     NARROWS to INV-1': every root Phase 1 OWNS runs and goes green; this one root is owned by
#     the Phase 2 cascade instead, and its completion is asserted by Phase 3 VERIFY. Single-root
#     `target=platform/management-groups mode=terraform` remains fully supported for an operator
#     who wants provider-faithful, state-exact removal and is willing to own the wall clock -
#     nothing about that path is withdrawn, and it now carries a bounded
#     `destroy_timeout_minutes: "90"` (`_tf-root.yml`) so a repeat of the same stall fails loud
#     with a LIVE token instead of silently burning six hours (see that job's own comment for
#     why a job-level `timeout-minutes:` cannot be used here at all).
#   - Phase 4 STATE RESET eligibility (`scripts/teardown-state-reset.sh`) is UNIFIED across both
#     modes: a key whose own Phase 1 job did not succeed is now ELIGIBLE anyway (except
#     `platform/identity`, permanently) on whole-estate VERIFY evidence, in EITHER mode - not
#     only under `mode=az-sweep` as ADR-068 decision 4 originally specified. This closes the gap
#     that left `platform/management` and `platform/management-groups`'s state blobs populated
#     after the 2026-08-01 run despite a PASSED Phase 3 VERIFY (an FM-2 condition blocking the
#     next rebuild's plan) - see that script's own header for the full amendment.
#   - Teardown Summary (`scripts/teardown-summary.sh`, new last job) - always runs at
#     target=all, no Azure calls, and distinguishes "estate verified clean, `management-groups`
#     correctly took the Phase 2 cascade path (INV-1')" from "a genuine, unexplained Phase 1
#     failure" from "Phase 3 VERIFY itself did not pass" - three situations a run's bare
#     conclusion could not tell apart, which is what made the 2026-08-01 run's overall FAILURE
#     conclusion misrepresent an estate that Phase 3 VERIFY had, in fact, certified clean. It
#     cannot and does not change the overall GitHub Actions run conclusion - see that script's
#     own header for why that is correct.
#
# Scope (OQ-012, unchanged): default tears down the 9 workload/platform roots ONLY and KEEPS
#   the bootstrap state backend + OIDC app, so redeploy is immediate. include_bootstrap=true
#   surfaces a MANUAL scorched-earth runbook (the SP can't delete its own OIDC app, and the
#   state-backend RG name is non-deterministic - LESSON 18 gap).
# Scope note (ADR-054, amended ADR-065, RE-AMENDED ADR-066): Phase 0/0.5/2/3 (disarm/
#   databricks-precascade/az-sweep/verify) only run for target=all - they are whole-estate
#   operations (MG-scope policy disarm, Databricks precascade, remnant-catch sweep, MG
#   hierarchy removal) that would be destructive surprises on an ad hoc single-root destroy. A
#   single-root destroy (target != all) runs ONLY that root's Phase 1 terraform-destroy,
#   unaffected by the other phases - unchanged by ADR-066. This is a known, accepted scope
#   boundary: a standalone single-root `landing-zones/bank-data-p1` destroy does not get the
#   Phase 0.5 Databricks precascade belt either, so it still hits the plain-delete
#   orphan-managed-RG gap Phase 0.5 exists to close at target=all - not a new gap, the same
#   single-root exclusion every other whole-estate-only phase already carries. Also unaffected
#   by ADR-066: the state-empty resilience fix in `_tf-root.yml` (which applies universally) and
#   the JIT state-SA firewall flip (`manage_runner_ip: true`, ADR-066 - previously
#   `target != 'all'`, ADR-065) so the single-root destroy can reach the firewalled state SA.
#   A target=all destroy with the default mode=terraform (ADR-066, supersedes ADR-065
#   decision 1; AMENDED 2026-08-01 by ADR-072 decision 6) now RUNS 10 Phase 1 per-root
#   terraform destroy jobs (`platform/management-groups` is no longer one of them - see the
#   AMENDED 2026-08-01 header note below), SERIALIZED in reverse-dependency order (one
#   state-SA-touching job open at a time), plus the Phase 1.5 attachment sweep, followed by the
#   Phase 2 az-sweep THIN BELT and Phase 3 VERIFY - the normal, transparent, state-faithful
#   Terraform model, mirroring the deploy. A target=all destroy with mode=az-sweep remains
#   the STATE-GONE FALLBACK (ADR-065 decision 4, kept): every Phase 1 job is skipped (gated
#   on `inputs.mode == 'terraform'`) and the whole-estate teardown is Phase 0 DISARM +
#   Phase 2 AZ SWEEP (whole-estate, its original full-coverage role, for this path only) +
#   Phase 3 VERIFY, which has zero state-backend dependency.
#
# Order = reverse of deploy.yml, and (ADR-066, AMENDED 2026-08-01 by ADR-072 decision 4/6) now
# the exact SERIALIZED chain at target=all: synthetic -> bank-data-p1 -> bank-app-p1 ->
#   online-p1 -> corp-a2 -> corp-a1 -> security -> connectivity -> identity ->
#   attachment-sweep (Phase 1.5) -> management. `management-groups` is NO LONGER part of this
#   chain at target=all (ADR-072 decision 6 - see the AMENDED 2026-08-01 header note above); it
#   is destroyed by the Phase 2 MG-hierarchy cascade instead and only runs here as an explicit
#   single-root dispatch. deploy.yml applies synthetic LAST (after all 5 spokes, ordering
#   hygiene only - see deploy.yml's comment), so teardown destroys it FIRST. terraform destroy
#   keeps state consistent for clean re-apply. Within the 5 spokes and within {connectivity,
#   security}, deploy.yml has no relative ordering requirement (they applied
#   independently/in parallel) - the linear order chosen here is one valid reverse-topological
#   sort, not the only one (ADR-066). `attachment-sweep`'s position (after `identity`, before
#   `management`) is fixed by ADR-072 decision 4: every declaring root above it has destroyed,
#   and it runs before the container-owning root's own destroy.
name: Teardown (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Root to destroy, or 'all' for the whole environment (reverse order). Phase 0/2/3 (disarm/az-sweep/verify, ADR-054) only run for target=all."
        type: choice
        default: all
        options:
          - all
          - platform/management-groups
          - platform/management
          - platform/connectivity
          - platform/identity
          - platform/security
          - landing-zones/corp-a1
          - landing-zones/corp-a2
          - landing-zones/online-p1
          - landing-zones/bank-app-p1
          - landing-zones/bank-data-p1
          - synthetic
      mode:
        description: "terraform (default) = primary path: single-root destroys that one root; at target=all (ADR-066, amended 2026-08-01 by ADR-072 decision 6) it runs 10 Phase 1 per-root terraform destroy jobs SERIALIZED in reverse-dependency order (platform/management-groups is destroyed by the Phase 2 MG cascade instead, not this chain), the Phase 1.5 attachment sweep, then the Phase 2 az-sweep thin belt, then Phase 3 VERIFY. az-sweep = rejected for a single root (see guard); at target=all it is the STATE-GONE FALLBACK (ADR-065 decision 4, kept) - every Phase 1 job is skipped and the whole-estate az-sweep flow (Phase 0 DISARM + Phase 2 AZ SWEEP, whole-estate + Phase 3 VERIFY) runs alone."
        type: choice
        default: terraform
        options:
          - terraform
          - az-sweep
      confirm:
        description: "Type 'destroy' to confirm. Anything else aborts before any login."
        type: string
        default: ""
      include_bootstrap:
        description: "Also tear down the state backend + OIDC app (scorched earth, manual runbook). Default false."
        type: boolean
        default: false
      remove_mg_hierarchy:
        description: "Phase 2: move the 5 subscriptions to the tenant root and delete the globaris MG tree bottom-up (ADR-054 section 5 - required for a clean redeploy against empty state; subs are preserved, only re-parented). Default false - set true explicitly at dispatch time for a full-estate teardown."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Confirm teardown
    runs-on: ubuntu-latest
    steps:
      - name: Verify typed confirmation
        # Inputs passed via env (not interpolated into the script body) to avoid shell injection.
        env:
          CONFIRM: ${{ inputs.confirm }}
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          INCLUDE_BOOTSTRAP: ${{ inputs.include_bootstrap }}
          REMOVE_MG_HIERARCHY: ${{ inputs.remove_mg_hierarchy }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "::error::'confirm' must be exactly 'destroy' to proceed. Aborting."
            exit 1
          fi
          # Reject mode=az-sweep with a single-root target: Phase 0/2/3 (disarm/az-sweep/
          # verify) only run for target=all (whole-estate operations) and Phase 1 root jobs
          # only run for mode=terraform, so mode=az-sweep + target!=all would run NOTHING
          # and still report green - the exact "green means nothing happened" anti-pattern
          # this redesign exists to eliminate. az-sweep is a whole-estate fallback; a
          # single-root ad hoc destroy must use mode=terraform.
          if [ "$MODE" = "az-sweep" ] && [ "$TARGET" != "all" ]; then
            echo "::error::mode=az-sweep requires target=all. az-sweep (Phase 2 fallback + Phase 0 disarm + Phase 3 verify) is a whole-estate operation and does not run for a single-root target - dispatching this combination would do nothing and still report green. For a single-root destroy use mode=terraform (the default)."
            exit 1
          fi
          # NOTICE (ADR-066, supersedes the ADR-065 notice this replaces; AMENDED 2026-08-01 by
          # ADR-072 decision 6): at target=all the mode input now DOES matter again.
          # mode=terraform (default) runs the full waved teardown - 10 Phase 1 per-root
          # terraform destroy jobs (platform/management-groups is no longer one of them), plus
          # the Phase 1.5 attachment sweep, serialized. mode=az-sweep
          # remains the state-gone fallback (ADR-065 decision 4, kept) - Phase 1 is skipped.
          if [ "$TARGET" = "all" ]; then
            if [ "$MODE" = "terraform" ]; then
              echo "NOTICE: target=all mode=terraform (default, ADR-066, AMENDED 2026-08-01 by ADR-072) runs the full waved teardown - Phase 0 DISARM, Phase 0.5 Databricks precascade (force-deletes any live Databricks workspace ahead of Phase 1), 10 Phase 1 per-root terraform destroy jobs SERIALIZED in reverse-dependency order (one state-SA-touching job open at a time; platform/management-groups is no longer part of this chain - ADR-072 decision 6, it is destroyed by the Phase 2 MG-hierarchy cascade instead), the Phase 1.5 attachment sweep (ADR-072 decision 4, clears cross-root RP-attached objects before platform/management's own destroy), the Phase 2 az-sweep thin remnant-catch belt, Phase 3 VERIFY, and (ADR-068, amended 2026-08-01, if VERIFY passes) Phase 4 STATE RESET - a key is reset if its own Phase 1 job succeeded, OR (except platform/identity, permanently excluded) on whole-estate VERIFY evidence if it did not. A final Teardown Summary job always reports which layers destroyed via Terraform, which (management-groups) took the designed Phase 2 cascade path, and whether VERIFY passed."
            else
              echo "NOTICE: target=all mode=az-sweep runs the state-gone FALLBACK path (ADR-065 decision 4, kept) - Phase 0 DISARM + Phase 2 AZ SWEEP (whole-estate, its original full-coverage role for this path only) + Phase 3 VERIFY; every Phase 1 per-root terraform destroy job is skipped (gated on mode=='terraform'). If VERIFY passes, Phase 4 STATE RESET (ADR-068, amended 2026-08-01) then resets every eligible workload/platform state blob to canonical empty EXCEPT platform/identity (permanently excluded unless its own destroy job succeeded, which never happens in this mode) and platform/management-groups unless remove_mg_hierarchy=true (carve-out B). A final Teardown Summary job always reports the outcome."
            fi
          fi
          echo "Confirmed. target=$TARGET mode=$MODE include_bootstrap=$INCLUDE_BOOTSTRAP remove_mg_hierarchy=$REMOVE_MG_HIERARCHY"

  # Phase 0 - DISARM (ADR-054). Runs first, before any resource deletion, so DINE
  # remediation cannot resurrect anything Phase 1/2 delete. target=all only (see header).
  disarm:
    name: "Phase 0 - DISARM (MG-scope policy assignments)"
    needs: [guard]
    if: ${{ !cancelled() && needs.guard.result == 'success' && inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: production-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Disarm all MG-scope policy assignments
        run: bash scripts/teardown-disarm.sh

  # Phase 0.5 - DATABRICKS PRECASCADE (ADR-066 decision 4 PREFERRED form; code-review Finding 2,
  # 2026-07-30). Runs alongside Phase 0 DISARM (both gate on `guard` only, no ordering
  # dependency between them) so the Databricks workspace force-delete is submitted WHILE the
  # workspace is still live, ahead of Phase 1's bank-data-p1 destroy. target=all AND
  # mode=terraform only - mode=az-sweep never runs Phase 1 at all, so az-sweep's own step 1
  # (teardown-az-sweep.sh) already force-deletes the workspace first in that path; wiring this
  # job there too would be a redundant duplicate, not a fix. See
  # scripts/teardown-databricks-precascade.sh's own header for the full root-cause account.
  #
  # `needs: [guard, diagnostic-precascade]` ADDED 2026-08-10 (ADR-076 decision 1). This job and
  # diagnostic-precascade below were previously wired as CONCURRENT (both `needs: [guard]` only),
  # on the stated premise that they "act on disjoint object classes" - that premise is FALSE for
  # a Databricks-hosted diagnostic setting: `diag-dbw-*` is an extension object keyed to the
  # workspace URI THIS job force-deletes, so whichever job reached the workspace first silently
  # won the race, and the diagnostic sweep losing that race was invisible (no completeness
  # assertion existed before ADR-076 decision 2 either). Live evidence: teardown run
  # `31350223388`'s diagnostic-precascade died mid-enumeration on
  # rg-bank-data-p1-dbx-managed-globaris-poc (ResourceGroupNotFound) because THIS job had already
  # force-deleted it out from under the concurrent enumeration. The `needs` edge below is
  # ORDERING ONLY, never a gate: the `!cancelled()` form of the `if:` (unchanged) means this job
  # still runs even if diagnostic-precascade failed or was skipped, preserving ADR-071 "not a
  # gate" and ADR-066 INV-1 exactly as before - only the RELATIVE ORDER changed.
  databricks-precascade:
    name: "Phase 0.5 - DATABRICKS PRECASCADE (force-delete while live)"
    needs: [guard, diagnostic-precascade]
    if: ${{ !cancelled() && needs.guard.result == 'success' && inputs.target == 'all' && inputs.mode == 'terraform' }}
    runs-on: ubuntu-latest
    environment: production-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Force-delete any live Databricks workspace (cascades the managed RG)
        env:
          MANAGEMENT_SUBSCRIPTION_ID: ${{ secrets.MANAGEMENT_SUBSCRIPTION_ID }}
          CONNECTIVITY_SUBSCRIPTION_ID: ${{ secrets.CONNECTIVITY_SUBSCRIPTION_ID }}
          IDENTITY_SUBSCRIPTION_ID: ${{ secrets.IDENTITY_SUBSCRIPTION_ID }}
          SECURITY_SUBSCRIPTION_ID: ${{ secrets.SECURITY_SUBSCRIPTION_ID }}
          LANDINGZONES_SUBSCRIPTION_ID: ${{ secrets.LANDINGZONES_SUBSCRIPTION_ID }}
        run: bash scripts/teardown-databricks-precascade.sh

  # Phase 0.5 - DIAGNOSTIC PRECASCADE (ADR-071 decision 4b). Gated identically to
  # databricks-precascade above (target=all AND mode=terraform) and, like it, deliberately NOT
  # wired for mode=az-sweep: Phase 1 never runs in that path, so Phase 2's own step 1-pre already
  # sweeps this class while hosts are live there, and a second call would be a redundant
  # duplicate rather than a fix. NOT a gate: a failure is loud but never skips a Phase 1 layer
  # (ADR-066 INV-1); the residue surfaces later as an `already exists` recovered by runbook B1.
  #
  # ORDERING (ADR-076 decision 1, 2026-08-10, CORRECTING the prior claim below). This job used to
  # run CONCURRENTLY with databricks-precascade above and disarm, on the stated premise that the
  # three "act on disjoint object classes" - that premise was FALSE for a Databricks-hosted
  # diagnostic setting (diag-dbw-* is keyed to the workspace URI databricks-precascade
  # force-deletes), and the race it created is what left run `31350223388`'s enumeration mid-air
  # on a Databricks-managed RG the concurrent job had already force-deleted. This job still gates
  # on `guard` only (no incoming `needs` edge itself - it does not depend on disarm or on
  # databricks-precascade), but databricks-precascade now `needs` THIS job (ordering only, never
  # a gate - see that job's own comment), so this sweep is guaranteed to complete, one way or the
  # other, before ANY host-deleting Phase 0.5 actor runs. It still runs alongside disarm (no
  # ordering relationship with disarm - genuinely disjoint scopes: MG-scope policy assignments
  # vs. resource-scoped diagnostic settings).
  diagnostic-precascade:
    name: "Phase 0.5 - DIAGNOSTIC PRECASCADE (delete settings while hosts are live)"
    needs: [guard]
    if: ${{ !cancelled() && needs.guard.result == 'success' && inputs.target == 'all' && inputs.mode == 'terraform' }}
    runs-on: ubuntu-latest
    environment: production-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete resource-scoped diagnostic settings while their hosts are still live
        env:
          MANAGEMENT_SUBSCRIPTION_ID: ${{ secrets.MANAGEMENT_SUBSCRIPTION_ID }}
          CONNECTIVITY_SUBSCRIPTION_ID: ${{ secrets.CONNECTIVITY_SUBSCRIPTION_ID }}
          IDENTITY_SUBSCRIPTION_ID: ${{ secrets.IDENTITY_SUBSCRIPTION_ID }}
          SECURITY_SUBSCRIPTION_ID: ${{ secrets.SECURITY_SUBSCRIPTION_ID }}
          LANDINGZONES_SUBSCRIPTION_ID: ${{ secrets.LANDINGZONES_SUBSCRIPTION_ID }}
        run: bash scripts/teardown-diagnostic-precascade.sh

  # Phase 1 (ADR-066, AMENDED 2026-08-01 by ADR-072 decision 6): a strictly LINEAR
  # reverse-dependency `needs` chain of 10 jobs - synthetic -> bank-data-p1 -> bank-app-p1 ->
  # online-p1 -> corp-a2 -> corp-a1 -> security -> connectivity -> identity -> management (plus
  # the non-counted Phase 1.5 attachment sweep between `identity` and `management` - see that
  # job's own comment). `platform/management-groups` is NO LONGER part of this chain - it is
  # destroyed by the Phase 2 MG-hierarchy cascade instead (ADR-072 decision 6) and only runs
  # here as an explicit single-root dispatch, outside this `needs` chain entirely. At
  # target=all every remaining job's `if:` is true (the `inputs.target == 'all'` disjunct,
  # restored - undoes ADR-065 decision 1) and GitHub Actions' unconditional `needs` dependency
  # edge (independent of any `if:`) forces them to run ONE AT A TIME in exactly this order, so
  # exactly one state-SA-touching job is ever open (`manage_runner_ip: true`, unconditional now
  # - see each job below). At a single-root target only that one job's `if:` is true; every
  # other job in the chain skips, and `needs` on a skipped predecessor never blocks a
  # downstream job because every `if:` uses `!cancelled()` (NOT the default implicit
  # success-gating) - the same F1-fix pattern this workflow already relies on, so single-root
  # behaviour is byte-for-byte unaffected by this reorder. This order respects every real
  # deploy dependency (spokes before connectivity/security; connectivity+security before
  # management) - `identity` has no real dependency on its neighbours in the chain (it only
  # ever needed `disarm`), so its linear position is free and was chosen to sit between
  # connectivity and management per ADR-066's own spec.
  #
  # `synthetic` is a REAL root (synthetic/*.tf define real resources - RGs, red-team ACA
  # jobs, cost-pattern VM/storage, etc. - gated behind var.enable_synthetic_workload,
  # currently false). deploy.yml applies it LAST (needs: the 5 spokes - "ordering hygiene",
  # it does not actually consume their outputs), so teardown destroys it FIRST, mirroring
  # that order. Hardened with the SAME resilience fix as every other root (`!cancelled()` +
  # `_tf-root.yml`'s state-empty no-op) rather than deleted - the F1 fix works via
  # resilience, not via removing a root from the graph. This closes the correctness gap a
  # deleted job would leave: a populated synthetic root (flag flipped true and applied) must
  # get a real `terraform destroy` so its Terraform state is retired cleanly, not just have
  # its RGs caught out-of-band by the Phase 2 naming-pattern sweep (which would leave
  # synthetic's own state drifted - "exists in state, gone in Azure").
  # `diagnostic-precascade` added to `needs` 2026-08-01 (ADR-071 decision 4b) for ORDERING ONLY,
  # on the CHAIN HEAD rather than on one root. The Databricks precascade only has to precede
  # `bank-data-p1`, the single root that owns the workspace, so it is wired there; the diagnostic
  # sweep enumerates hosts across EVERY root, so it has to finish before the FIRST Phase 1 destroy
  # deletes any host - otherwise it races the chain and the settings on whatever was destroyed
  # first become exactly the FM-3 orphans this job exists to prevent.
  #
  # It is deliberately NOT added to the `if:` below. Per ADR-071 decision 4b this must NOT be a
  # gate: `needs` supplies the ordering edge, while the `!cancelled()` form of the `if:` (NOT the
  # default implicit success-gating) means a FAILED or SKIPPED precascade still lets every Phase 1
  # root run and go green, preserving ADR-066 INV-1. Same ordering-not-gating pattern this
  # workflow already uses for `disarm`, and skip-safe for the single-root and mode=az-sweep paths
  # where `diagnostic-precascade` never runs at all.
  synthetic:
    needs: [guard, disarm, diagnostic-precascade]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'synthetic') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: synthetic
      action: destroy
      backend_rel: "../"
      gh_environment: production-destroy
      # ADR-066: chain position 1 of 10. manage_runner_ip unconditional - this job is only
      # ever reached serialized (single-root, or first in the target=all chain).
      manage_runner_ip: true
    secrets: inherit

  # NOTE (ADR-066 decision 4, IMPLEMENTED - code-review Finding 2, 2026-07-30): Databricks IS
  # deployed in this estate (enable_data_platform=true, envs/poc.tfvars), so bank-data-p1's
  # terraform destroy issuing a PLAIN delete on the workspace (retaining an orphan managed RG)
  # is genuinely load-bearing, not a theoretical gap. Closed by the new Phase 0.5
  # `databricks-precascade` job (above), which force-deletes the workspace WHILE IT IS STILL
  # LIVE, before this job runs - see that job's own comment. `needs` includes it for ORDERING
  # ONLY (same F1 convention as `synthetic` below - a sibling/helper job's own result is never
  # gated on here, only guard/disarm are hard gates): if the precascade job itself fails, this
  # job still RUNS and still goes green (preserving INV-1' - every root Phase 1 OWNS runs
  # green, ADR-072 decision 6), and any resulting orphan managed RG is then a correct, loud
  # VERIFY 2/3 failure (ADR-066 decision 5),
  # not a silently-skipped mandatory layer.
  bank-data-p1:
    needs: [guard, disarm, databricks-precascade, synthetic]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'landing-zones/bank-data-p1') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/bank-data-p1
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-066: chain position 2 of 10.
      manage_runner_ip: true
    secrets: inherit

  bank-app-p1:
    needs: [guard, disarm, bank-data-p1]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'landing-zones/bank-app-p1') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/bank-app-p1
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-066: chain position 3 of 10.
      manage_runner_ip: true
    secrets: inherit

  online-p1:
    needs: [guard, disarm, bank-app-p1]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'landing-zones/online-p1') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/online-p1
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-066: chain position 4 of 10.
      manage_runner_ip: true
    secrets: inherit

  corp-a2:
    needs: [guard, disarm, online-p1]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'landing-zones/corp-a2') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/corp-a2
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-066: chain position 5 of 10.
      manage_runner_ip: true
    secrets: inherit

  corp-a1:
    needs: [guard, disarm, corp-a2]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'landing-zones/corp-a1') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: landing-zones/corp-a1
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-066: chain position 6 of 10.
      manage_runner_ip: true
    secrets: inherit

  security:
    needs: [guard, disarm, corp-a1]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'platform/security') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/security
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-066: chain position 7 of 10. Its terraform destroy also destroys
      # azurerm_resource_group.security (this root owns and destroys its own RG). The Security
      # LAW is now PURGED NATIVELY as part of this same destroy
      # (platform/security/providers.tf sets `permanently_delete_on_destroy = true`, Cloud
      # Engineer fix, 2026-07-30) - Phase 2's OQ-063 step (teardown-az-sweep.sh, "step 7b") is
      # now a BACKSTOP for this class, not the primary purge.
      #
      # SINGLE-ROOT CALLOUT (Finding 5, code-review, 2026-07-30): the native purge above only
      # ever applies when this root's OWN terraform destroy actually deletes the workspace. A
      # single-root `target=platform/security` teardown gets exactly that (the native purge
      # fires normally, no gap). The gap is the OTHER direction: Phase 2's OQ-063 backstop step
      # ONLY runs at target=all (it lives in the az-sweep job, target=all only) - so if this
      # root's destroy is ever run in a way that leaves the LAW merely soft-deleted (e.g. an
      # older provider config without the purge feature, or a partial/interrupted destroy),
      # a single-root `platform/security` teardown has NO belt to catch it. Operators tearing
      # down `platform/security` alone should confirm the provider purge feature is in effect
      # (or dispatch a target=all run at least once) rather than assume LAW-clean from a
      # single-root run alone.
      manage_runner_ip: true
    secrets: inherit

  connectivity:
    needs: [guard, disarm, security]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'platform/connectivity') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/connectivity
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-066: chain position 8 of 10.
      manage_runner_ip: true
    secrets: inherit

  identity:
    needs: [guard, disarm, connectivity]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'platform/identity') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/identity
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-066: chain position 9 of 10. No real dependency on connectivity/security - its
      # linear slot here is free (see the chain-level comment above) and matches ADR-066's
      # own given order.
      manage_runner_ip: true
    secrets: inherit

  # Phase 1.5 - ATTACHMENT SWEEP (ADR-072 decision 4). Inserted between `identity` and
  # `management` - the position ADR-072 specifies: after every declaring root's own destroy
  # (all four Traffic-Analytics-enabled spokes plus bank-app-p1's AKS addon, all earlier in this
  # chain) and before the container-owning root (platform/management) destroys its resource
  # group. `needs: identity` is sufficient for ordering (identity itself needs connectivity,
  # which needs security, ... down to synthetic - the same transitive-chain convention every
  # other job in this file already relies on). target=all AND mode=terraform only, mirroring
  # `databricks-precascade`'s own gating (mode=az-sweep never runs Phase 1 at all, and the
  # API-level `az group delete` there already cascades whatever the RG contains - a second
  # mechanism would be a duplicate, not a fix).
  #
  # NOT A GATE (ADR-072 decision 4, "not a gate", the same wiring `databricks-precascade` uses
  # for `bank-data-p1`): a failure here is loud (the job itself reports red) but `management`'s
  # own `if:` below does not read this job's result - `needs: attachment-sweep` is for ORDERING
  # only. A residual left behind by a failure here surfaces instead as platform/management's own
  # `prevent_deletion_if_contains_resources` error or a loud Phase 2/3 remnant, never as a
  # silently-skipped mandatory layer.
  attachment-sweep:
    name: "Phase 1.5 - ATTACHMENT SWEEP (cross-root RP-attached objects)"
    needs: [guard, disarm, identity]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: production-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sweep cross-root RP-attached objects (NWTA DCE/DCR, ContainerInsights solution)
        env:
          MANAGEMENT_SUBSCRIPTION_ID: ${{ secrets.MANAGEMENT_SUBSCRIPTION_ID }}
          CONNECTIVITY_SUBSCRIPTION_ID: ${{ secrets.CONNECTIVITY_SUBSCRIPTION_ID }}
          IDENTITY_SUBSCRIPTION_ID: ${{ secrets.IDENTITY_SUBSCRIPTION_ID }}
          SECURITY_SUBSCRIPTION_ID: ${{ secrets.SECURITY_SUBSCRIPTION_ID }}
          LANDINGZONES_SUBSCRIPTION_ID: ${{ secrets.LANDINGZONES_SUBSCRIPTION_ID }}
        run: bash scripts/teardown-attachment-sweep.sh

  management:
    needs: [guard, disarm, attachment-sweep]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && (inputs.target == 'all' || inputs.target == 'platform/management') }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/management
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-066: chain position 10 of 10 (last). `needs` reads attachment-sweep (ADR-072 decision 4,
      # ordering only, not a gate - see that job's own comment above) instead of `identity`
      # directly; identity is still reached transitively (attachment-sweep itself needs it).
      manage_runner_ip: true
    secrets: inherit

  # ADR-072 decision 6 AMENDS ADR-066: this root is no longer part of the mode=terraform
  # PRIMARY target=all path. Its objects are overwhelmingly child objects of eleven container
  # (MG) scopes with no cascading-container-delete equivalent inside Terraform's own per-object
  # destroy model, while Phase 2 step 4 (teardown-az-sweep.sh, gated on remove_mg_hierarchy)
  # already offers exactly that bulk primitive - live evidence: two rebuild cycles each applied
  # exactly 537 objects cleanly after an MG-tree cascade, with zero `already exists` collisions.
  # ADR-066 INV-1 ("all eleven Phase-1 layer destroys run and go green") NARROWS to INV-1':
  # every root Phase 1 owns runs and goes green; this one is owned by the Phase 2 cascade and
  # its completion is asserted by Phase 3 VERIFY, not by this job (see ADR-072 decision 6 and
  # DECISIONS.md for the full ruling - this is a topology decision, not a tuning one).
  #
  # So at target=all this job's `if:` below no longer fires at all (the `inputs.target == 'all'`
  # disjunct is REMOVED, not just left unreachable) - it now runs ONLY as an explicit single-root
  # dispatch (`target=platform/management-groups`), which ADR-072 decision 6 explicitly keeps
  # available "for an operator who wants provider-faithful, state-exact removal and is willing to
  # own the wall clock".
  #
  # `destroy_timeout_minutes: "90"` is a DevSecOps addition (Defect 1, the six-hour-refresh-stall
  # incident, teardown run 30685705802): measured from that run's own job log,
  # `azapi_resource.policy_role_assignments` refreshed in tight batches of ~10 (Terraform's
  # default parallelism) at almost EXACTLY one-hour intervals with zero logged errors in between -
  # the signature of a silent client-side retry-with-backoff loop, not a hard failure (the
  # DISARM-causes-403-on-a-deleted-scope hypothesis was TESTED against this same log and
  # REFUTED: every MG scope involved was still alive throughout, and DISARM only deletes POLICY
  # assignments, a different object type from the roleAssignments that stalled). The exact
  # mechanism is UNVERIFIED (a leading candidate is azapi's own retry/timeout defaults - see
  # WORKLOG for the full account) and is not fixed here; `terraform destroy` refreshes its
  # ENTIRE state before issuing any delete, so a run killed mid-refresh completes ZERO deletes
  # regardless of where the ceiling sits - trimming the ceiling cannot make this root's destroy
  # succeed faster, only fail louder and sooner. 90 minutes is a judgment call (generous against
  # every healthy destroy of this root on record, decisively short of the 6-hour GitHub Actions
  # job default and of the point where the OIDC assertion itself becomes stale).
  #
  # NOTE ON MECHANISM: a job-level `timeout-minutes:` is NOT valid syntax here (GitHub Actions
  # rejects `timeout-minutes` on any job whose body is `uses: <reusable workflow>` - "Unexpected
  # value 'timeout-minutes'", confirmed against GitHub's own community discussion #50481 and
  # reproduced independently by multiple reporters, 2026-08-01). `_tf-root.yml`'s "Terraform
  # Destroy" step instead wraps the command in the coreutils `timeout` utility (present on
  # ubuntu-latest) when this input is non-empty - see that workflow's own `destroy_timeout_minutes`
  # input for the full mechanism. This is also STRICTLY BETTER than a job-level kill would have
  # been: a shell-level timeout only terminates the destroy subprocess, so every later step in
  # the SAME job (crucially, "Restore state SA firewall to Deny") still runs with a LIVE OIDC
  # token, instead of dying at the exact instant the token itself goes stale (the "two ceilings
  # that are the same number" failure mode this whole fix exists to break).
  #
  # Not applied to any other root - this codebase has at least one documented case of a
  # LEGITIMATELY multi-hour create/destroy elsewhere (platform/identity's AADDS domain, LESSON
  # 46), and a blanket short timeout would risk killing a genuinely progressing job rather than
  # only a stalled one.
  management-groups:
    needs: [guard, disarm, management]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.mode == 'terraform' && inputs.target == 'platform/management-groups' }}
    uses: ./.github/workflows/_tf-root.yml
    with:
      root: platform/management-groups
      action: destroy
      backend_rel: "../../"
      gh_environment: production-destroy
      # ADR-072 decision 6: no longer chain position 11 of 11 at target=all (it does not run
      # there at all now) - reachable only via an explicit single-root dispatch. `needs:
      # management` is retained so a hypothetical future re-widening has the right ordering
      # already in place, and so this job's position in the file continues to read naturally
      # after `management` even though the two no longer share a live target=all edge.
      manage_runner_ip: true
      destroy_timeout_minutes: "90"
    secrets: inherit

  # Phase 2 - AZ SWEEP (ADR-054). Fallback for mode=az-sweep (state gone) AND a
  # remnant-catch pass after Phase 1 in mode=terraform. `needs` lists every Phase 1 job for
  # ORDERING only (run after them) - `!cancelled()` means none of their individual outcomes
  # gates this job. target=all only (see header).
  #
  # GATED ON disarm.result (2026-07-23, ADR-063 decision 9, owner override 9a). Previously
  # this job gated ONLY on guard.result and target=='all', so a failed DISARM (Phase 0) did
  # NOT stop this job - on target=all with DISARM failed, every Phase-1 root job above skips
  # (they all gate on disarm.result) but az-sweep proceeded alone, degrading the run from
  # `terraform destroy` to raw REST deletes with zero terraform state updates, while ADR-063's
  # own MG-scope extension sweep (now in Phase 0/disarm) may not have completed either - the
  # one-way-door G-1 gap this ADR exists to close, walked through by the one job that was told
  # the door was open. The `skipped` limb matches the Phase-1 root-job form exactly so a
  # single-target dispatch (where disarm does not run at all) is unaffected.
  az-sweep:
    name: "Phase 2 - AZ SWEEP (fallback / remnant-catch)"
    needs: [guard, disarm, synthetic, corp-a1, corp-a2, online-p1, bank-app-p1, bank-data-p1, connectivity, security, identity, management, management-groups]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: production-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: AZ sweep (Databricks cascade, RG naming-pattern delete, KV purge, MG hierarchy)
        env:
          MANAGEMENT_SUBSCRIPTION_ID: ${{ secrets.MANAGEMENT_SUBSCRIPTION_ID }}
          CONNECTIVITY_SUBSCRIPTION_ID: ${{ secrets.CONNECTIVITY_SUBSCRIPTION_ID }}
          IDENTITY_SUBSCRIPTION_ID: ${{ secrets.IDENTITY_SUBSCRIPTION_ID }}
          SECURITY_SUBSCRIPTION_ID: ${{ secrets.SECURITY_SUBSCRIPTION_ID }}
          LANDINGZONES_SUBSCRIPTION_ID: ${{ secrets.LANDINGZONES_SUBSCRIPTION_ID }}
          REMOVE_MG_HIERARCHY: ${{ inputs.remove_mg_hierarchy }}
          # ADR-054 amendment (docs/teardown-redesign.md section 10.5): so the script's
          # az_relogin helper can mint a FRESH GitHub OIDC assertion on demand and re-
          # authenticate mid-job, instead of relying on az's own (structurally broken, one-
          # time-assertion) token refresh. ACTIONS_ID_TOKEN_REQUEST_URL / _TOKEN are already
          # auto-present because the workflow sets `permissions: id-token: write` above - not
          # hardcoded here. Identity via repo Variables only, no client secret (secrets above
          # only ever feed TF_VAR_*-equivalent subscription IDs, never credentials).
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: bash scripts/teardown-az-sweep.sh

  # Phase 3 - VERIFY (ADR-054). Always last, runs for target=all. FAILS the run if any estate
  # remnant is found - a green Phase 3 is the definition of "teardown succeeded E2E".
  # Read-only (no deletions) but still needs the production-destroy environment for OIDC (the
  # only federated credential trust configured for this class of operation).
  #
  # GATED ON disarm.result (2026-07-23, ADR-063 decision 9, OWNER OVERRIDE 9a - see
  # DECISIONS.md for the full record). The architect's proposal was to gate az-sweep only and
  # leave verify ungated, on the grounds that VERIFY is the best inventory of live estate state
  # the pipeline produces and suppressing it on exactly the runs that went wrong is backwards;
  # DevSecOps independently recommended the same split. The owner overruled that and ruled to
  # gate BOTH jobs, unconditionally, for one uniform rule with no conditional-wording contract
  # to get wrong and no path by which a green-looking VERIFY can be produced by a run that
  # aborted. Cost, stated plainly per the override record: a failed DISARM now suppresses
  # VERIFY too, so an operator gets no VERIFY output precisely in the runs where the estate is
  # most likely to be in a bad or half-known state - diagnosing such a run needs a separate
  # read-only dispatch (scripts/teardown-probe-extensions.sh) or a manual run, not this job's
  # own output. Implemented as ruled. The `skipped` limb matches the Phase-1 root-job form
  # exactly so a single-target dispatch (where disarm does not run at all) is unaffected.
  verify:
    name: "Phase 3 - VERIFY (loud completion check)"
    needs: [guard, disarm, synthetic, corp-a1, corp-a2, online-p1, bank-app-p1, bank-data-p1, connectivity, security, identity, management, management-groups, az-sweep]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.disarm.result == 'success' || needs.disarm.result == 'skipped') && inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: production-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify zero estate remnants (fails loudly if any remain)
        env:
          MANAGEMENT_SUBSCRIPTION_ID: ${{ secrets.MANAGEMENT_SUBSCRIPTION_ID }}
          CONNECTIVITY_SUBSCRIPTION_ID: ${{ secrets.CONNECTIVITY_SUBSCRIPTION_ID }}
          IDENTITY_SUBSCRIPTION_ID: ${{ secrets.IDENTITY_SUBSCRIPTION_ID }}
          SECURITY_SUBSCRIPTION_ID: ${{ secrets.SECURITY_SUBSCRIPTION_ID }}
          LANDINGZONES_SUBSCRIPTION_ID: ${{ secrets.LANDINGZONES_SUBSCRIPTION_ID }}
          REMOVE_MG_HIERARCHY: ${{ inputs.remove_mg_hierarchy }}
        run: bash scripts/teardown-verify.sh

  # Phase 4 - STATE RESET (ADR-068, DECISIONS.md). Runs scripts/teardown-state-reset.sh, which
  # overwrites (never deletes - INV-STATE) every eligible workload/platform Terraform state
  # blob with a canonical, metadata-labelled EMPTY document, so a green target=all teardown
  # also leaves the state backend behaving as if it had never been used - closing the gap
  # where mode=az-sweep (Phase 1 never runs there) left every root's state fully populated
  # describing resources VERIFY had just proven gone. See that script's own header for the
  # full per-key eligibility rules (carve-out A: platform/identity, never reset under
  # mode=az-sweep; carve-out B: platform/management-groups, only when
  # remove_mg_hierarchy=true) and for why "reset an already-empty blob" is a clean no-op, not
  # a special case.
  #
  # THE `!cancelled()` PREFIX IS LOAD-BEARING. DO NOT REMOVE IT.
  #
  # CORRECTED 2026-07-30 at the code-review gate, before this ever ran. The first version of
  # this job omitted `!cancelled()` on the reasoning that a hard `needs.verify.result ==
  # 'success'` gate was stricter, and carried a comment forbidding anyone from "fixing" it.
  # That reasoning was wrong, and ADR-068 decision 2's own quoted YAML carried the same defect
  # (see its 2026-07-30 addendum). GitHub Actions applies an IMPLICIT `success()` requirement
  # across every job in `needs:` UNLESS the `if:` expression itself invokes a status-check
  # function (`success()`, `failure()`, `cancelled()`, `always()`). A plain string comparison
  # like `needs.verify.result == 'success'` does NOT count as invoking one.
  #
  # Consequence of the omission: at `mode=az-sweep` all 11 Phase-1 jobs are gated on
  # `inputs.mode == 'terraform'` and report `skipped`, so the implicit `success()` over this
  # job's 13-entry `needs:` list fails and GitHub auto-skips Phase 4 outright - in the exact
  # mode ADR-068 exists to fix, with the run still reporting green because a skipped job is
  # not a failed one. An operator following the runbook would "reset state through the
  # teardown", watch it go green, and get nothing.
  #
  # `!cancelled()` removes only that IMPLICIT all-needs-must-succeed default. It does not
  # weaken the EXPLICIT `needs.verify.result == 'success'` conjunct below, which remains the
  # entire safety gate: Phase 4 still cannot run after a failed, skipped or cancelled VERIFY,
  # so FM-1 (state emptied while resources may be live) stays impossible. This is the same
  # shape the sibling `az-sweep` and `verify` jobs already use, and the reason they run at all
  # in az-sweep mode while the Phase-1 jobs around them are skipped.
  #
  # If a future change makes VERIFY itself target-selective or partial, re-examine the
  # explicit conjunct THEN. Do not touch the `!cancelled()` prefix.
  state-reset:
    name: "Phase 4 - STATE RESET (canonical empty state, ADR-068)"
    needs: [guard, verify, synthetic, bank-data-p1, bank-app-p1, online-p1, corp-a2, corp-a1,
            security, connectivity, identity, management, management-groups]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.verify.result == 'success' && inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: production-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required repo Variables (LESSON 15 - vars, not secrets)
        run: |
          missing=""
          [ -n "${{ vars.AZURE_CLIENT_ID }}" ]       || missing="$missing AZURE_CLIENT_ID"
          [ -n "${{ vars.AZURE_TENANT_ID }}" ]       || missing="$missing AZURE_TENANT_ID"
          [ -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository Variables:$missing (Settings -> Variables, NOT Secrets)"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Same JIT open/3-consecutive-probe-wait pattern as teardown-probe.yml's own "Open state
      # SA firewall" step (ADR-025) - copied rather than shared, matching that workflow's own
      # precedent (it has no Terraform root/backend_rel context to reuse _tf-root.yml's step
      # from, and this job has none either). This job is always the LAST job in a target=all
      # run that ever touches the state SA (it needs every Phase 1 job plus verify), so exactly
      # one flip is ever open at a time (LESSON 31) - safe by construction against CONCURRENT
      # flips. The SEQUENTIAL race remains (2026-08-07, run 31219463271): the immediately
      # preceding job's exit-restore can still hold the account's exclusive-operation lock
      # when this flip fires - and this job runs directly after Phase 1's restores, a tighter
      # window than the cross-run gap that failed live. Hence the bounded retry below, and
      # the restore-arming BEFORE the first attempt (a failed CLI call's operation can land
      # asynchronously after the error, leaving the SA at Allow with the restore disarmed).
      - name: Open state SA firewall for this run (ADR-025)
        env:
          BACKEND_HCL: envs/poc.backend.hcl
        run: |
          set -euo pipefail
          SA_NAME="$(grep -E '^\s*storage_account_name' "$BACKEND_HCL" | sed -E 's/.*=\s*"?([^"#[:space:]]+)"?.*/\1/')"
          RG_NAME="$(grep -E '^\s*resource_group_name'  "$BACKEND_HCL" | sed -E 's/.*=\s*"?([^"#[:space:]]+)"?.*/\1/')"
          CONTAINER="$(grep -E '^\s*container_name'     "$BACKEND_HCL" | sed -E 's/.*=\s*"?([^"#[:space:]]+)"?.*/\1/')"
          echo "Flipping default_action=Allow on $SA_NAME (rg $RG_NAME) for this state-reset run"
          echo "STATE_SA_NAME=$SA_NAME" >> "$GITHUB_ENV"
          echo "STATE_SA_RG=$RG_NAME"   >> "$GITHUB_ENV"
          echo "SA_OPENED=1"            >> "$GITHUB_ENV"
          flipped=0
          for attempt in 1 2 3 4 5; do
            if az storage account update \
                 --name "$SA_NAME" --resource-group "$RG_NAME" \
                 --default-action Allow --output none; then
              flipped=1; break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Flip attempt $attempt/5 failed (likely a still-running operation from a prior job) - retrying in 30s..."
              sleep 30
            fi
          done
          if [ "$flipped" != "1" ]; then
            echo "::error::Could not flip default_action=Allow on $SA_NAME after 5 attempts (~2 min of retries)."
            exit 1
          fi
          # default_action=Allow is monotonic once propagated but NOT instant and NOT
          # consistent across front-end nodes at the moment it flips (same caveat _tf-root.yml
          # documents) - require 3 CONSECUTIVE successful blob-list probes, 8s apart, before
          # declaring the firewall open.
          echo "Waiting for the state-SA firewall to open (3 consecutive probe successes required)..."
          ready=0
          consecutive=0
          for i in $(seq 1 32); do
            if az storage blob list \
                 --account-name "$SA_NAME" --container-name "$CONTAINER" \
                 --auth-mode login --num-results 1 --only-show-errors -o none 2>/dev/null; then
              consecutive=$((consecutive + 1))
              echo "Probe success $consecutive/3 (~$(( (i-1) * 8 ))s elapsed)."
              if [ "$consecutive" -ge 3 ]; then
                echo "State SA firewall settled after ~$(( (i-1) * 8 ))s."
                ready=1; break
              fi
            else
              if [ "$consecutive" -gt 0 ]; then
                echo "Probe FAILED after $consecutive success(es) - propagation not settled; counter reset."
              fi
              consecutive=0
            fi
            sleep 8
          done
          if [ "$ready" != "1" ]; then
            echo "::error::State SA firewall did not settle (3 consecutive probe successes) within ~256s."
            exit 1
          fi

      - name: Reset eligible state blobs to canonical empty (Phase 4, ADR-068)
        env:
          TEARDOWN_MODE: ${{ inputs.mode }}
          REMOVE_MG_HIERARCHY: ${{ inputs.remove_mg_hierarchy }}
          # Per-root Phase 1 destroy job results, so the script can compute per-key
          # eligibility (ADR-068 decision 4) without any second API call - GITHUB_RUN_ID and
          # GITHUB_SHA (used for the blob metadata stamp) are already present in every step's
          # environment by default and are not set here.
          PHASE1_RESULTS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/teardown-state-reset.sh

      # Always restore default_action=Deny, even if a prior step failed, so the state SA never
      # stays publicly reachable past this run.
      - name: Restore state SA firewall to Deny (ADR-025)
        if: ${{ always() && env.SA_OPENED == '1' }}
        run: |
          set -uo pipefail
          echo "Restoring default_action=Deny on $STATE_SA_NAME"
          restored=0
          for attempt in 1 2 3 4 5; do
            if az storage account update \
                 --name "$STATE_SA_NAME" --resource-group "$STATE_SA_RG" \
                 --default-action Deny --output none; then
              restored=1; break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "Restore attempt $attempt/5 failed - retrying in 30s..."
              sleep 30
            fi
          done
          if [ "$restored" != "1" ]; then
            echo "::warning::Failed to restore Deny on $STATE_SA_NAME after 5 attempts - set default_action=Deny manually."
          fi

  # Scorched earth (OQ-012 = false by default). The SP cannot delete its own OIDC app
  # (needs Entra/Graph rights, not ARM Owner) and the state-backend RG name is
  # non-deterministic (LESSON 18 gap) - so this emits the manual runbook rather than a
  # blind delete. Only runs for target=all with include_bootstrap=true, after Phase 3.
  teardown-bootstrap:
    needs: [guard, verify]
    if: ${{ !cancelled() && needs.guard.result == 'success' && inputs.include_bootstrap && inputs.target == 'all' }}
    runs-on: ubuntu-latest
    environment: production-destroy
    steps:
      - name: Scorched-earth runbook (manual)
        run: |
          echo "::warning::include_bootstrap=true: the state backend + OIDC app are NOT auto-deleted by CI."
          echo "Run these locally, authenticated as a privileged user:"
          echo "  # 1. Delete the Terraform state backend resource group (find its exact name first):"
          echo "  az group list --subscription <management_sub_id> --query \"[?starts_with(name,'rg-tfstate')].name\" -o tsv"
          echo "  az group delete --name <rg-tfstate-mgmt-XXXXXX> --subscription <management_sub_id> --yes"
          echo "  # 2. Delete the OIDC app registration (SP lacks Graph rights to self-delete):"
          echo "  az ad app delete --id <oidc_client_id>"
          echo "See docs/cicd-deploy-teardown.md section 6 and bootstrap/README."

  # Teardown Summary (DevSecOps fix, teardown run 30685705802, "Defect 3"). Runs ALWAYS, target=
  # all only, and reads pure job-status data - no Azure calls, no OIDC login, no environment
  # gate needed (least privilege: a job that only reports never needs a credential). Root cause
  # this closes: that run's Phase 3 VERIFY PASSED (Azure genuinely verified clean) while two
  # Phase 1 jobs had failed, and the run's overall conclusion (FAILURE, driven purely by GitHub's
  # own job-conclusion aggregation) materially misrepresented what the run achieved - the same
  # class of defect as a green run that did not mean what it said, inverted.
  #
  # THIS JOB CANNOT AND DOES NOT CHANGE THE OVERALL RUN CONCLUSION - see scripts/teardown-
  # summary.sh's own header for why that is correct, not a limitation to work around: a genuine
  # Phase-1 failure on a layer with no designed fallback (i.e. any layer other than
  # platform/management-groups, ADR-072 decision 6) must keep failing the run loud, in full,
  # exactly as today. What this job adds is a single, clearly-labelled place that distinguishes
  # "estate verified clean, `platform/management-groups` correctly took the Phase 2 cascade path
  # (INV-1')" from "a genuine, unexplained Phase 1 failure" from "Phase 3 VERIFY itself did not
  # pass" - three different situations this run's own bare conclusion could not tell apart.
  #
  # `if: always()` (not `!cancelled()`): this is the one job in the file that is SUPPOSED to run
  # and report even when everything upstream failed or was cancelled, precisely so an operator
  # facing the worst-case run still gets an honest, structured account of what happened.
  teardown-summary:
    name: "Teardown Summary (run-outcome distinction)"
    needs: [guard, disarm, databricks-precascade, diagnostic-precascade, synthetic, bank-data-p1,
            bank-app-p1, online-p1, corp-a2, corp-a1, security, connectivity, identity,
            attachment-sweep, management, management-groups, az-sweep, verify, state-reset]
    if: ${{ always() && inputs.target == 'all' }}
    runs-on: ubuntu-latest
    # Least privilege: this job only reads job-status data GitHub Actions already computed - no
    # Azure call, no OIDC login. Narrows away the workflow-level `id-token: write` it does not
    # need (contents: read is enough for the checkout step below).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Summarize run outcome
        env:
          ALL_RESULTS_JSON: ${{ toJSON(needs) }}
          TARGET: ${{ inputs.target }}
          MODE: ${{ inputs.mode }}
          REMOVE_MG_HIERARCHY: ${{ inputs.remove_mg_hierarchy }}
        run: bash scripts/teardown-summary.sh
